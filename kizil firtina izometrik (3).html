<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KIZIL FIRTINA — İzometrik</title>
<style>
  :root{
    --ink:#0d0f0c; --panel:#181b16; --panel2:#22261f;
    --steel:#3a4034; --line:#4a5142;
    --gold:#d9b13b; --red:#d8442f; --blue:#4a7fb5;
    --txt:#cfd3c3; --dim:#8a8f7c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
    font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--txt);
    -webkit-user-select:none;user-select:none;}
  .stencil{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
    letter-spacing:2px;text-transform:uppercase;}
  #wrap{display:flex;flex-direction:column;width:100%;height:100%;}
  #topbar{height:44px;background:linear-gradient(#2a2e25,#181b16);
    border-bottom:2px solid var(--line);display:flex;align-items:center;
    gap:14px;padding:0 12px;flex:none;z-index:5;}
  #topbar .logo{color:var(--red);font-size:19px;}
  #topbar .logo span{color:var(--gold);}
  #credits{color:var(--gold);font-size:18px;min-width:110px;}
  #powerwrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);}
  #powerbar{width:110px;height:10px;background:#111;border:1px solid var(--line);}
  #powerfill{height:100%;width:50%;background:#5fae4a;transition:width .3s;}
  #topbar .btn-mini{margin-left:auto;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);padding:5px 10px;cursor:pointer;font-size:13px;}
  #topbar .btn-mini+.btn-mini{margin-left:0;}
  #topbar .btn-mini.on{border-color:var(--gold);color:var(--gold);background:var(--steel);}
  #main{flex:1;display:flex;min-height:0;}
  #viewport{flex:1;position:relative;min-width:0;background:#000;}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;}
  #sidebar{width:196px;flex:none;background:var(--panel);
    border-left:2px solid var(--line);display:flex;flex-direction:column;}
  #minimapbox{padding:8px;border-bottom:1px solid var(--line);}
  #minimap{width:100%;aspect-ratio:1;background:#000;border:1px solid var(--line);
    display:block;cursor:pointer;image-rendering:pixelated;}
  #tabs{display:flex;border-bottom:1px solid var(--line);}
  .tab{flex:1;padding:9px 0;text-align:center;font-size:13px;cursor:pointer;
    background:var(--panel2);color:var(--dim);border-right:1px solid var(--line);}
  .tab:last-child{border-right:none;}
  .tab.on{background:var(--steel);color:var(--gold);}
  #buttons{flex:1;overflow-y:auto;padding:8px;display:grid;
    grid-template-columns:1fr 1fr;gap:8px;align-content:start;}
  .bbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:7px 4px;cursor:pointer;text-align:center;position:relative;
    font-size:11px;line-height:1.25;min-height:64px;overflow:hidden;}
  .bbtn .ic{font-size:20px;display:block;margin-bottom:2px;}
  .bbtn .cost{color:var(--gold);font-size:11px;}
  .bbtn:disabled{opacity:.35;cursor:not-allowed;}
  .bbtn .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:0%;}
  .bbtn.ready{border-color:var(--gold);animation:blink 1s infinite;}
  .bbtn.ready::after{content:"HAZIR";position:absolute;top:2px;right:3px;
    color:var(--gold);font-size:9px;font-weight:bold;}
  .bbtn .qn{position:absolute;top:2px;right:4px;color:var(--gold);font-size:11px;font-weight:bold;}
  @keyframes blink{50%{background:var(--steel);}}
  #selinfo{border-top:1px solid var(--line);padding:8px;font-size:11px;
    color:var(--dim);min-height:40px;}
  .overlay{position:absolute;inset:0;background:rgba(8,10,7,.94);z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;overflow-y:auto;}
  #titleScreen h1{font-size:min(15vw,92px);margin-bottom:10px;
    text-shadow:0 0 0 rgba(217,177,59,0);}
  #titleScreen h1.play{animation:titleGlow 4s ease-out forwards;}
  @keyframes titleGlow{
    0%{transform:scale(.92);text-shadow:0 0 0 rgba(217,177,59,0);}
    25%{transform:scale(1.04);text-shadow:0 0 34px rgba(217,177,59,.8),0 0 80px rgba(216,68,47,.5);}
    100%{transform:scale(1);text-shadow:0 0 14px rgba(217,177,59,.35);}
  }
  #tapHint{color:var(--dim);font-size:15px;letter-spacing:4px;
    animation:pulseHint 1.6s infinite;}
  @keyframes pulseHint{50%{opacity:.35;}}
  #missions{display:flex;flex-direction:column;gap:11px;width:min(380px,88vw);margin:14px 0;}
  .mbtn{width:100%;padding:13px 16px;font-size:17px;line-height:1.3;}
  .mbtn .msub{display:block;font-size:12px;letter-spacing:1px;opacity:.85;margin-top:3px;
    font-family:"Trebuchet MS",Verdana,sans-serif;text-transform:none;}
  .overlay h1{font-size:min(11vw,64px);color:var(--red);margin-bottom:4px;}
  .overlay h1 span{color:var(--gold);}
  .overlay h2{font-size:22px;color:var(--gold);margin-bottom:18px;font-weight:normal;}
  .overlay p{max-width:480px;color:var(--txt);font-size:14px;line-height:1.6;margin-bottom:8px;}
  .overlay .keys{color:var(--dim);font-size:12.5px;line-height:1.7;margin:10px 0 22px;}
  .bigbtn{background:var(--red);border:2px solid #7c2418;color:#fff;
    font-size:20px;padding:14px 42px;cursor:pointer;letter-spacing:3px;}
  .bigbtn:hover{background:#e8563f;}
  #endScreen{display:none;}
  #notifs{position:absolute;left:12px;bottom:12px;z-index:6;pointer-events:none;
    display:flex;flex-direction:column;gap:4px;}
  .notif{background:rgba(13,15,12,.85);border-left:3px solid var(--gold);
    padding:5px 10px;font-size:12.5px;color:var(--txt);animation:fadein .2s;}
  .notif.alert{border-left-color:var(--red);color:#f0b0a5;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
  @media (max-width:640px){
    #sidebar{width:150px;}
    #buttons{grid-template-columns:1fr;}
    #topbar .logo{display:none;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <div class="logo stencil">KIZIL <span>FIRTINA</span></div>
    <div id="credits" class="stencil">₺ 0</div>
    <div id="powerwrap">⚡<div id="powerbar"><div id="powerfill"></div></div><span id="powertxt"></span></div>
    <div id="rampTimer" class="stencil" style="display:none;color:var(--red);font-size:15px;">☄ 25:00</div>
    <button class="btn-mini" id="allBtn" title="Tüm orduyu seç (E)">⚔</button>
    <button class="btn-mini" id="musBtn" title="Marş aç/kapat">🎵</button>

  </div>
  <div id="main">
    <div id="viewport">
      <canvas id="game"></canvas>
      <div id="notifs"></div>
      <div class="overlay" id="titleScreen">
        <h1 class="stencil" id="titleLogo">KIZIL <span>FIRTINA</span></h1>
        <div id="tapHint">— BAŞLAMAK İÇİN DOKUN —</div>
      </div>
      <div class="overlay" id="startScreen" style="display:none">
        <h1 class="stencil" style="font-size:min(9vw,42px);margin-bottom:2px">KIZIL <span>FIRTINA</span></h1>
        <h2 class="stencil" style="font-size:15px;color:var(--dim);margin-bottom:4px">GÖREV SEÇİMİ</h2>
        <div id="missions">
          <button class="bigbtn stencil mbtn" id="startBtn">1. BÖLÜM — NEHİR HATTI
            <span class="msub">Köprüleri tut, Demir Pakt'ı nehrin ötesine göm</span></button>
          <button class="bigbtn stencil mbtn" id="startBtn2" style="background:#3a4a7c;border-color:#232d52">2. BÖLÜM — İKİNCİ CEPHE
            <span class="msub" id="l2sub">🔒 1. Bölümü bitir</span></button>
          <button class="bigbtn stencil mbtn" id="startBtn3" style="background:#2e3e4a;border-color:#1a2630">3. BÖLÜM — DEMİR KIŞ ❄
            <span class="msub" id="l3sub">🔒 2. Bölümü bitir</span></button>
        </div>
        <div class="keys" style="margin:2px 0 12px">
          🖱 sürükle: seç • sağ tık: emir • tekerlek / iki parmak: zoom<br>
          ⌨ E: ordu &nbsp; T: tamir &nbsp; P: duraklat &nbsp; ESC: iptal &nbsp; 📱 dokun: seç / git
        </div>
        <button class="btn-mini" id="unlockBtn" style="opacity:.7">🔓 Tüm bölümleri aç</button>
      </div>
      <div class="overlay" id="endScreen">
        <h1 id="endTitle" class="stencil">ZAFER</h1>
        <p id="endText"></p>
        <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
          <button class="bigbtn stencil" id="restartBtn">YENİDEN OYNA</button>
          <button class="bigbtn stencil" id="nextBtn" style="display:none;background:#3a4a7c;border-color:#232d52">2. BÖLÜME GEÇ ➤</button>
          <button class="bigbtn stencil" id="menuBtn" style="background:var(--steel);border-color:var(--line);">ANA MENÜ</button>
        </div>
      </div>
    </div>
    <div id="sidebar">
      <div id="minimapbox"><canvas id="minimap" width="168" height="168"></canvas></div>
      <div id="tabs">
        <div class="tab on" data-tab="build">İNŞAAT</div>
        <div class="tab" data-tab="units">BİRLİK</div>
      </div>
      <div id="buttons"></div>
      <div id="selinfo">Birim seçilmedi.</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   KIZIL FIRTINA v2 — İzometrik sürüm
   Nehir, köprüler, ormanlar ve detaylı birimlerle.
   ===================================================================== */

// ---------- SABİTLER ----------
const TILE=32;
let MW=56, MH=56;
let WORLD_W=MW*TILE, WORLD_H=MH*TILE;
const IW=64, IH=32;                    // izometrik karo boyutu
let ISO_X0=MH*TILE+IW;                 // terrain canvas x kaydırması
const ISO_Y0=IH*2;                     // terrain canvas y kaydırması
const PLAYER=0, ENEMY=1;
let NTEAMS=2, LEVEL=1;
const TEAM_COLOR=['#c8402e','#4a7fb5','#c9a227'];
const TEAM_LIGHT=['#e86a55','#6f9fd0','#e8c85a'];
const TEAM_DARK =['#7c2418','#2a4c72','#7a611a'];
function setMapSize(w,h){
  MW=w;MH=h;WORLD_W=MW*TILE;WORLD_H=MH*TILE;ISO_X0=MH*TILE+IW;
  buildTerrChunks();
  buildFogCanvas();
}

const BUILD_TYPES={

  nuclear :{name:'Nükleer Santral',ic:'☢',w:3,h:3,hp:900, cost:1500,power:300, req:'refinery',ht:36,lvl:2},

            dmg:60,range:5.2,cd:1.8, ht:26,lvl:2},
  sam     :{name:'SAM Kulesi',     ic:'🛰',w:1,h:1,hp:500, cost:900, power:-45, req:'barracks',
            dmg:40,range:7.0,cd:1.5, ht:16,lvl:3},
  dronebase:{name:'Dron Üssü',     ic:'📡',w:2,h:2,hp:800, cost:1100,power:-40, req:'factory',ht:20,lvl:3},
  pylon   :{name:'Kontrol Pilonu', ic:'📶',w:2,h:2,hp:1200,cost:0,   power:0,   req:null,ht:46,lvl:3},

            dmg:34,range:6.4,cd:1.0, ht:10}
};
const UNIT_TYPES={
  rifle :{name:'Piyade',   ic:'🔫',cost:100, hp:60, dmg:8,  range:3.6,cd:0.8,speed:55,size:7, prod:'barracks'},
  rocket:{name:'Roketçi',  ic:'🚀',cost:300, hp:50, dmg:24, range:5.2,cd:2.0,speed:50,size:7, prod:'barracks',canAA:true},
  medic :{name:'Sıhhiyeci', ic:'⚕', cost:350, hp:70, dmg:0,  range:0,  cd:0,  speed:58,size:7, prod:'barracks'},
  tank  :{name:'Tank',     ic:'🛡',cost:700, hp:300,dmg:30, range:4.6,cd:1.6,speed:85,size:12,prod:'factory'},
  heavy :{name:'Ağır Tank',ic:'💥',cost:1250,hp:560,dmg:48, range:5.0,cd:2.0,speed:62,size:14,prod:'factory'},
  harv  :{name:'Hasatçı',  ic:'🚜',cost:900, hp:420,dmg:0,  range:0,  cd:0,  speed:70,size:13,prod:'factory'},
  arty  :{name:'Roket Topçusu',ic:'🎇',cost:950, hp:140,dmg:70, range:8.5,cd:4.0,speed:45,size:12,prod:'factory',lvl:2,splash:45},
  boat  :{name:'Devriye Botu', ic:'🚤',cost:800, hp:350,dmg:26, range:5.5,cd:1.2,speed:95,size:13,prod:'shipyard',lvl:2,domain:'sea'},
  heli  :{name:'Saldırı Helikopteri',ic:'🚁',cost:1400,hp:300,dmg:38,range:4.5,cd:1.0,speed:130,size:12,prod:'heliport',lvl:2,domain:'air',canAA:true},
  sdrone:{name:'Sürü Dronu',   ic:'🐝',cost:120, hp:35, dmg:60,range:0.6,cd:9,  speed:150,size:6,prod:'hive',domain:'air',canAA:true},
  hdrone:{name:'Avcı Dron',    ic:'🦅',cost:300, hp:120,dmg:18,range:3.8,cd:0.7,speed:150,size:8,prod:'hive',domain:'air',canAA:true,airOnly:true},
  rdrone:{name:'Keşif Dronu',  ic:'👁',cost:400, hp:90, dmg:0, range:0,  cd:0,  speed:160,size:7,prod:'dronebase',lvl:3,domain:'air'},
  tdrone:{name:'Taktik Dron',  ic:'🛸',cost:950, hp:190,dmg:26,range:4.6,cd:1.1,speed:120,size:9,prod:'dronebase',lvl:3,domain:'air',canAA:true}
};
const HARV_CAP=500, HARV_RATE=90;
const REPAIR_RATE=16, REPAIR_COST=1/3;   // bina tamiri: hp/sn, ₺/hp
const HEAL_RATE=10, HEAL_COST=0.25, HEAL_RANGE=4.5; // istasyon: hp/sn, ₺/hp, karo

// ---------- DURUM ----------
let terrain, ore, water, bridge, tree, treeSeed, blockedGrid, explored;
let buildings=[], units=[], shells=[], particles=[], tracers=[];
let credits=[3500,1500];
let cam={x:0,y:0};
let selected=[];
let placing=null;
let queues=null;
let ais=[];   // takım 1..N-1 için AI durumları
let stats=null; // görev istatistikleri
let l3=null;    // Bölüm 3: {rampT,total,tech,bolt,nextBolt,storm,stormT,rage}
let ridge=null; // sarp kaya sırtları (geçilmez)
let running=false, paused=false, gameOver=false;
let simTime=0, idSeq=1;
let soundOn=true;
let lastAttackWarn=-99;

// ---------- DOM ----------
const $=id=>document.getElementById(id);
const cvs=$('game'), ctx=cvs.getContext('2d');
const mmCvs=$('minimap'), mmCtx=mmCvs.getContext('2d');
// arazi ön-çizimi: dilimli tuvaller (büyük haritada mobil canvas sınırına takılmamak için)
let terrChunks=[];
// sis: karo başına 1 piksel, bilinear büyütme ile yumuşak kenar
const fogSm=document.createElement('canvas');
let fogSmCtx=null, exploredA=null;
function buildFogCanvas(){
  fogSm.width=MW; fogSm.height=MH;
  fogSmCtx=fogSm.getContext('2d');
  exploredA=new Float32Array(MW*MH);
}
function buildTerrChunks(){
  const totalW=(MW+MH)*TILE+IW*2, totalH=(MW+MH)*(IH/2)+IH*4;
  terrChunks=[];
  const CW=3072;
  for(let x=0;x<totalW;x+=CW){
    const c=document.createElement('canvas');
    c.width=Math.min(CW,totalW-x); c.height=totalH;
    terrChunks.push({x,cvs:c,ctx:c.getContext('2d')});
  }
}

// ---------- İZOMETRİK DÖNÜŞÜM ----------
// dünya(px, dik) → izometrik ekran
function isoX(wx,wy){return wx-wy;}
function isoY(wx,wy){return (wx+wy)/2;}
// izometrik ekran → dünya
function unisoX(sx,sy){return sx/2+sy;}
function unisoY(sx,sy){return sy-sx/2;}
// karo köşe (üst tepe) izometrik konumu
function tileIso(tx,ty){return [ (tx-ty)*TILE, (tx+ty)*(IH/2) ];}

function hash2(x,y){ // deterministik gürültü 0..1
  let h=(x*374761393+y*668265263)|0; h=(h^(h>>13))*1274126177;
  return ((h^(h>>16))>>>0)/4294967295;
}

// =====================================================================
// SES + TTS
// =====================================================================
let AC=null, dryBus=null, verbBus=null, distBus=null;
function makeIR(ac,dur,decay){
  const len=ac.sampleRate*dur, ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++)
      d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  }
  return ir;
}
function audio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      // master zincir: her şey kompresörden geçer → tok, taşmayan mix
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-16; comp.knee.value=18; comp.ratio.value=5;
      comp.attack.value=0.003; comp.release.value=0.25;
      comp.connect(AC.destination);
      dryBus=AC.createGain(); dryBus.gain.value=0.95; dryBus.connect(comp);
      // mekân: prosedürel impulse response ile konvolüsyon reverb
      const verb=AC.createConvolver();
      verb.buffer=makeIR(AC,1.9,2.8);
      verbBus=AC.createGain(); verbBus.gain.value=0.8;
      verbBus.connect(verb); verb.connect(comp);
      // grit: waveshaper distorsiyon hattı
      const ws=AC.createWaveShaper();
      const N=1024,curve=new Float32Array(N),k=42;
      for(let i=0;i<N;i++){const x=i/(N-1)*2-1;curve[i]=(1+k)*x/(1+k*Math.abs(x));}
      ws.curve=curve; ws.oversample='2x';
      distBus=AC.createGain(); distBus.gain.value=0.5;
      distBus.connect(ws); ws.connect(dryBus);
    }catch(e){}
  }
  return AC;
}
function route(ac,g,rev,distAmt){
  g.connect(dryBus||ac.destination);
  if(rev&&verbBus){const sd=ac.createGain();sd.gain.value=rev;g.connect(sd);sd.connect(verbBus);}
  if(distAmt&&distBus){const sd=ac.createGain();sd.gain.value=distAmt;g.connect(sd);sd.connect(distBus);}
}
function beep(freq,dur,type,vol){
  if(!soundOn)return; const ac=audio(); if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.06,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
function boom(){ sfx('boom'); }
// ---- SES PAKETİ v1: katmanlı sentez efektleri ----
let noiseCache=null;
function noiseBuf(ac){
  if(noiseCache)return noiseCache;
  const n=ac.sampleRate*1.2, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  noiseCache=b; return b;
}
function nz(ac,t,dur,vol,f0,f1,type,rev,distAmt){ // filtreli gürültü zarfı
  const src=ac.createBufferSource(); src.buffer=noiseBuf(ac); src.loop=true;
  src.playbackRate.value=0.9+Math.random()*0.2; // her seferinde farklı doku
  const fl=ac.createBiquadFilter(); fl.type=type||'lowpass';
  fl.frequency.setValueAtTime(f0,t);
  if(f1)fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  fl.Q.value=type==='bandpass'?1.1:0.8;
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.004); // sert transient
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(fl);fl.connect(g);
  route(ac,g,rev===undefined?0.15:rev,distAmt||0);
  src.start(t);src.stop(t+dur+0.05);
}
function tn(ac,t,dur,f0,f1,type,vol,rev,distAmt){ // ton zarfı (kayma destekli)
  const o=ac.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);
  route(ac,g,rev===undefined?0.12:rev,distAmt||0);
  o.start(t);o.stop(t+dur+0.05);
}

let musicOn=true, mInt=null, mStep=0, mNext=0;
const M_TEMPO=132;
function startMusic(){
  const ac=audio(); if(!ac||mInt)return;
  mNext=ac.currentTime+0.15; mStep=0;
  mInt=setInterval(musicTick,90);
}
function stopMusic(){ if(mInt){clearInterval(mInt);mInt=null;} }
function musicTick(){
  const ac=AC;
  if(!ac||!musicOn||!soundOn)return;
  const spb=60/M_TEMPO/4;
  while(mNext<ac.currentTime+0.28){
    playStep(mStep%32,mNext);
    mStep++; mNext+=spb;
  }
}
const M_BASS=[82.4,82.4,98.0,82.4, 110.0,110.0,123.5,82.4]; // Em: E E G E | A A B E
const M_LEAD=[[0,329.6],[4,392.0],[6,329.6],[8,493.9],[12,440.0],[16,329.6],[20,392.0],[24,246.9],[28,329.6]];
function playStep(sN,t){
  const ac=AC;
  if(sN%8===0){tn(ac,t,0.13,105,42,'sine',0.13,0.1,0.5);}    // kick (hafif gritli)
  if(sN%8===4){nz(ac,t,0.005,0.12,4000,2000,'highpass',0.1,0);
               nz(ac,t,0.11,0.08,2400,800,'bandpass',0.35,0);} // trampet (tok + odalı)
  if(sN>=28&&sN<31)nz(ac,t,0.05,0.055,2500,1100,'bandpass',0.3,0); // rulo
  if(sN%2===0)nz(ac,t,0.03,0.015,7500,5200,'highpass',0.08,0);     // zil
  if(sN%4===0){ // bas
    const f=M_BASS[(sN>>2)%8];
    tn(ac,t,0.2,f,0,'sawtooth',0.045);
    tn(ac,t,0.2,f/2,0,'sine',0.05);
  }
  if(Math.floor(mStep/32)%2===0){ // motif her iki barda bir
    for(const [st,f] of M_LEAD)
      if(sN===st)tn(ac,t,0.16,f,0,'sawtooth',0.028);
  }
}

function inMap(x,y){return x>=0&&y>=0&&x<MW&&y<MH;}
let baseSpots=[]; // takım üs merkezleri (karo)
function inBaseZone(x,y){ // üs bölgeleri temiz kalsın
  for(const b of baseSpots)
    if(Math.abs(x-b[0])<=9&&Math.abs(y-b[1])<=9)return true;
  return false;
}
function genMap(){
  if(LEVEL>=3){genValleyMap();return;}
  ridge=new Uint8Array(MW*MH);
  if(LEVEL>=2){genIslandMap();return;}
  terrain=new Uint8Array(MW*MH);
  ore=new Float32Array(MW*MH);
  water=new Uint8Array(MW*MH);
  bridge=new Uint8Array(MW*MH);
  tree=new Uint8Array(MW*MH);
  treeSeed=new Float32Array(MW*MH);
  explored=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++) terrain[i]=Math.floor(hash2(i%MW,(i/MW)|0)*4);

  // --- NEHİR: batıdan doğuya, ortadan kıvrılarak akar ---
  let ry=27+Math.random()*3;
  const centers=[];
  for(let x=0;x<MW;x++){
    ry+=(Math.random()-0.5)*1.6;
    ry=Math.max(21,Math.min(34,ry));
    centers.push(ry);
  }
  // hafif yumuşatma
  for(let p=0;p<2;p++)
    for(let x=1;x<MW-1;x++) centers[x]=(centers[x-1]+centers[x]+centers[x+1])/3;
  for(let x=0;x<MW;x++){
    const c=centers[x];
    for(let y=Math.floor(c-1.4);y<=Math.ceil(c+1.4);y++)
      if(inMap(x,y)) water[y*MW+x]=1;
  }
  // --- KÖPRÜLER: üç geçit ---
  for(const bx of [9,27,46]){
    for(let x=bx;x<bx+2;x++)
      for(let y=0;y<MH;y++)
        if(water[y*MW+x]) bridge[y*MW+x]=1;
  }
  // --- ORMANLAR ---
  for(let c=0;c<16;c++){
    let x=3+Math.floor(Math.random()*(MW-6)), y=3+Math.floor(Math.random()*(MH-6));
    const n=6+Math.floor(Math.random()*14);
    for(let s=0;s<n;s++){
      if(inMap(x,y)&&!water[y*MW+x]&&!inBaseZone(x,y)){
        tree[y*MW+x]=1; treeSeed[y*MW+x]=Math.random();
      }
      x+=Math.floor(Math.random()*3)-1; y+=Math.floor(Math.random()*3)-1;
    }
  }
  // --- CEVHER YATAKLARI (su/ağaç/üs merkezine değil) ---
  orePatch(13,49,34); orePatch(4,38,26);
  orePatch(50,10,34); orePatch(42,3,26);
  orePatch(27,36,30); orePatch(30,19,30);
  orePatch(20,44,18); orePatch(38,12,18);
}
function genValleyMap(){
  terrain=new Uint8Array(MW*MH);
  ore=new Float32Array(MW*MH);
  water=new Uint8Array(MW*MH);
  bridge=new Uint8Array(MW*MH);
  tree=new Uint8Array(MW*MH);
  treeSeed=new Float32Array(MW*MH);
  explored=new Uint8Array(MW*MH);
  ridge=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++)terrain[i]=Math.floor(hash2(i%MW,(i/MW)|0)*4);
  baseSpots=[[44,78],[44,10]];
  // --- SARP SIRT KUŞAKLARI: iki kademe, dar geçitlerle ---
  const belts=[
    {y:32, passes:[14,44,73]},
    {y:56, passes:[27,60]}
  ];
  for(const belt of belts){
    let by2=belt.y;
    for(let x=0;x<MW;x++){
      by2+=(hash2(x,belt.y)-0.5)*1.4;
      by2=Math.max(belt.y-3,Math.min(belt.y+3,by2));
      let inPass=false;
      for(const px of belt.passes)if(Math.abs(x-px)<3)inPass=true;
      if(inPass)continue;
      const th=2+Math.floor(hash2(x*3,belt.y)*2);
      for(let dy=0;dy<th;dy++){
        const yy=Math.round(by2)+dy;
        if(inMap(x,yy))ridge[yy*MW+x]=1;
      }
    }
  }
  // --- DONMUŞ NEHİR: sırtlar arasında, buz üstü yürünür ---
  let ry=43;
  for(let x=0;x<MW;x++){
    ry+=(hash2(x*7,3)-0.5)*1.2; ry=Math.max(40,Math.min(47,ry));
    for(let y=Math.floor(ry-1.4);y<=Math.ceil(ry+1.4);y++)
      if(inMap(x,y)&&!ridge[y*MW+x])water[y*MW+x]=1;
  }
  // --- KARLI ÇAM ORMANLARI ---
  for(let cN=0;cN<30;cN++){
    let x=3+Math.floor(Math.random()*(MW-6)), y=3+Math.floor(Math.random()*(MH-6));
    const n=6+Math.floor(Math.random()*12);
    for(let sN=0;sN<n;sN++){
      if(inMap(x,y)&&!water[y*MW+x]&&!ridge[y*MW+x]&&!inBaseZone(x,y)){
        tree[y*MW+x]=1; treeSeed[y*MW+x]=Math.random();
      }
      x+=Math.floor(Math.random()*3)-1; y+=Math.floor(Math.random()*3)-1;
    }
  }
  // --- CEVHER: güney (oyuncu), orta (çekişmeli), kuzey (düşman) ---
  orePatch(32,74,44); orePatch(58,76,40); orePatch(44,66,30);
  orePatch(20,45,34); orePatch(66,44,34); orePatch(44,48,26);
  orePatch(30,16,40); orePatch(58,14,40);
}
function genIslandMap(){
  terrain=new Uint8Array(MW*MH);
  ore=new Float32Array(MW*MH);
  water=new Uint8Array(MW*MH);
  bridge=new Uint8Array(MW*MH);
  tree=new Uint8Array(MW*MH);
  treeSeed=new Float32Array(MW*MH);
  explored=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++){terrain[i]=Math.floor(hash2(i%MW,(i/MW)|0)*4); water[i]=1;}
  // üç ada — eşkenar üçgen köşelerinde, merkeze eşit uzaklıkta
  const c=MW/2, R=MW*0.30, r=MW*0.185;
  const isles=[];
  for(let k=0;k<3;k++){
    const a=-Math.PI/2 + k*2*Math.PI/3;
    isles.push([Math.round(c+R*Math.cos(a)), Math.round(c+R*Math.sin(a))]);
  }
  for(const [ix,iy] of isles){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      const wob=1+0.16*Math.sin(Math.atan2(y-iy,x-ix)*3+hash2(ix,iy)*7);
      if(Math.hypot(x-ix,y-iy)<r*wob)water[y*MW+x]=0;
    }
  }
  // köprüler: her ada çifti arasında 2 karo genişlik
  for(let a=0;a<3;a++)for(let b=a+1;b<3;b++){
    const [x1,y1]=isles[a],[x2,y2]=isles[b];
    const steps=Math.ceil(Math.hypot(x2-x1,y2-y1)*2);
    for(let sN=0;sN<=steps;sN++){
      const f=sN/steps;
      const px=Math.round(x1+(x2-x1)*f), py=Math.round(y1+(y2-y1)*f);
      for(let dy=0;dy<=1;dy++)for(let dx=0;dx<=1;dx++){
        const nx=px+dx,ny=py+dy;
        if(inMap(nx,ny)&&water[ny*MW+nx])bridge[ny*MW+nx]=1;
      }
    }
  }
  baseSpots=isles.map(v=>[v[0],v[1]]);
  // ormanlar (adaların üzerinde)
  for(let cN=0;cN<36;cN++){
    let x=3+Math.floor(Math.random()*(MW-6)), y=3+Math.floor(Math.random()*(MH-6));
    const n=6+Math.floor(Math.random()*12);
    for(let sN=0;sN<n;sN++){
      if(inMap(x,y)&&!water[y*MW+x]&&!inBaseZone(x,y)){
        tree[y*MW+x]=1; treeSeed[y*MW+x]=Math.random();
      }
      x+=Math.floor(Math.random()*3)-1; y+=Math.floor(Math.random()*3)-1;
    }
  }
  // her adada cevher: üsse yakın + kıyıya doğru
  for(const [ix,iy] of isles){
    orePatch(ix+8,iy+6,52); orePatch(ix-8,iy-5,44);
    orePatch(ix+3,iy-10,34); orePatch(ix-5,iy+10,34);
    orePatch(ix+11,iy-2,26);
  }
}
function orePatch(cx,cy,n){
  let x=cx,y=cy;
  for(let i=0;i<n;i++){
    if(inMap(x,y)&&!water[y*MW+x]&&!tree[y*MW+x])
      ore[y*MW+x]=Math.min(800, ore[y*MW+x]+350+Math.random()*350);
    x+=Math.floor(Math.random()*3)-1; y+=Math.floor(Math.random()*3)-1;
    if(Math.random()<0.15){x=cx;y=cy;}
  }
}
function rebuildBlocked(){
  blockedGrid=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++){
    if(tree[i])blockedGrid[i]=1;
    if(ridge&&ridge[i])blockedGrid[i]=1;
    if(water[i]&&!bridge[i]&&LEVEL<3)blockedGrid[i]=1; // L3: donmuş nehir yürünebilir
  }
  for(const b of buildings)
    for(let y=b.ty;y<b.ty+b.h;y++)
      for(let x=b.tx;x<b.tx+b.w;x++)
        blockedGrid[y*MW+x]=1;
}
function isBlocked(x,y){return !inMap(x,y)||blockedGrid[y*MW+x]===1;}
function isBlockedFor(x,y,domain){
  if(!inMap(x,y))return true;
  const i=y*MW+x;
  if(domain==='sea')return !water[i]||bridge[i]===1; // botlar köprü altından geçemez
  return blockedGrid[i]===1;
}
function freeNear(x,y){
  for(let r=0;r<=7;r++)
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&!isBlocked(nx,ny))return [nx,ny];
    }
  return [x,y];
}
function ensureConnectivity(){
  // tüm üs çiftleri arasında kara yolu olmalı (üs merkezi bina içinde olabilir → yakın boş kare)
  const ok=()=>{
    const probes=baseSpots.map(b=>freeNear(b[0],b[1]));
    for(let a=0;a<probes.length;a++)for(let b=a+1;b<probes.length;b++)
      if(!astar(probes[a][0],probes[a][1],probes[b][0],probes[b][1]))return false;
    return true;
  };
  if(ok())return;
  if(LEVEL>=3&&ridge){ // geçit aç: orta sütunda sırtı del
    for(let x=42;x<=46;x++)for(let y=0;y<MH;y++)ridge[y*MW+x]=0;
    rebuildBlocked();
    if(ok())return;
  }
  for(let bx=4;bx<MW-4;bx+=5){
    for(let x=bx;x<bx+2;x++)for(let y=0;y<MH;y++)
      if(water[y*MW+x])bridge[y*MW+x]=1;
    rebuildBlocked();
    if(ok())return;
  }
}

// ---------- A* ----------
function astar(sx,sy,tx,ty,domain){
  domain=domain||'ground';
  const blk=(x,y)=>isBlockedFor(x,y,domain);
  if(!inMap(tx,ty))return null;
  if(blk(tx,ty)){
    let best=null,bd=1e9;
    for(let r=1;r<=4&&!best;r++)
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        const nx=tx+dx,ny=ty+dy;
        if(!blk(nx,ny)){const d=dx*dx+dy*dy; if(d<bd){bd=d;best=[nx,ny];}}
      }
    if(!best)return null; tx=best[0]; ty=best[1];
  }
  if(sx===tx&&sy===ty)return [];
  const open=[[sx,sy]], came=new Map(), g=new Map();
  const k=(x,y)=>y*MW+x;
  g.set(k(sx,sy),0);
  const f=new Map(); f.set(k(sx,sy),Math.hypot(tx-sx,ty-sy));
  const inOpen=new Set([k(sx,sy)]);
  let expansions=0;
  while(open.length){
    if(++expansions>14000)return null;
    let bi=0,bf=1e18;
    for(let i=0;i<open.length;i++){const kk=k(open[i][0],open[i][1]);const ff=f.get(kk);if(ff<bf){bf=ff;bi=i;}}
    const [cx,cy]=open.splice(bi,1)[0]; inOpen.delete(k(cx,cy));
    if(cx===tx&&cy===ty){
      const path=[]; let cur=k(cx,cy);
      while(came.has(cur)){ path.push([cur%MW,Math.floor(cur/MW)]); cur=came.get(cur); }
      path.reverse();
      return path.map(p=>({x:p[0]*TILE+TILE/2,y:p[1]*TILE+TILE/2}));
    }
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=cx+dx,ny=cy+dy;
      if(blk(nx,ny))continue;
      if(dx&&dy&&(blk(cx+dx,cy)||blk(cx,cy+dy)))continue;
      const cost=(dx&&dy)?1.414:1;
      const ng=g.get(k(cx,cy))+cost, nk=k(nx,ny);
      if(!g.has(nk)||ng<g.get(nk)){
        g.set(nk,ng); came.set(nk,k(cx,cy));
        f.set(nk,ng+Math.hypot(tx-nx,ty-ny));
        if(!inOpen.has(nk)){open.push([nx,ny]);inOpen.add(nk);}
      }
    }
  }
  return null;
}

function addBuilding(team,key,tx,ty){
  const t=BUILD_TYPES[key];
  // bina zemini altındaki cevheri temizle (hayalet cevher hedefi kalmasın)
  for(let y=ty;y<ty+t.h;y++)for(let x=tx;x<tx+t.w;x++)
    if(inMap(x,y)){ore[y*MW+x]=0;tree[y*MW+x]=0;if(ridge)ridge[y*MW+x]=0;}
  const b={id:idSeq++,ent:'b',team,key,tx,ty,w:t.w,h:t.h,
    x:(tx+t.w/2)*TILE, y:(ty+t.h/2)*TILE,
    hp:t.hp,maxHp:t.hp, cool:0, target:null, angle:0, flash:0, smokeT:0};
  buildings.push(b); rebuildBlocked();
  revealAround(b.x,b.y,team,7);
  if(key==='refinery'&&running){
    const u=addUnit(team,'harv',b.x,(b.ty+b.h)*TILE+14);
    u.state='idle';
    if(team===PLAYER)notify('🚜 Ücretsiz Hasatçı hizmete girdi.');
  }
  return b;
}
function addUnit(team,key,x,y){
  const t=UNIT_TYPES[key];
  const u={id:idSeq++,ent:'u',team,key,x,y,
    hp:t.hp,maxHp:t.hp,speed:t.speed,size:t.size,
    dmg:t.dmg,range:t.range*TILE,cd:t.cd,cool:0,
    state:'idle',path:null,pi:0,target:null,repath:0,
    domain:t.domain||'ground', canAA:!!t.canAA, airOnly:!!t.airOnly, splash:t.splash||0,
    angle:team===PLAYER?-Math.PI/2:Math.PI/2, flash:0, muzzle:0, anim:Math.random()*7,
    load:0, oreTile:null, dest:null};
  units.push(u);
  return u;
}
function canPlace(key,tx,ty,team){
  const t=BUILD_TYPES[key];
  if(t.lvl&&LEVEL<t.lvl)return false;
  for(let y=ty;y<ty+t.h;y++)for(let x=tx;x<tx+t.w;x++){
    if(!inMap(x,y)||blockedGrid[y*MW+x]||ore[y*MW+x]>0||water[y*MW+x])return false;
    for(const u of units)
      if(Math.abs(u.x-(x*TILE+16))<24&&Math.abs(u.y-(y*TILE+16))<24)return false;
  }
  let near=false;
  for(const b of buildings){
    if(b.team!==team)continue;
    const dx=Math.max(b.tx-(tx+t.w-1), tx-(b.tx+b.w-1),0);
    const dy=Math.max(b.ty-(ty+t.h-1), ty-(b.ty+b.h-1),0);
    if(Math.hypot(dx,dy)<=7){near=true;break;}
  }
  if(!near)return false;
  if(t.coast){ // tersane: en az bir kenarı suya değmeli
    let touch=false;
    for(let y=ty-1;y<=ty+t.h&&!touch;y++)for(let x=tx-1;x<=tx+t.w&&!touch;x++)
      if(inMap(x,y)&&water[y*MW+x])touch=true;
    if(!touch)return false;
  }
  return true;
}
function hasBuilding(team,key){
  return buildings.some(b=>b.team===team&&b.key===key);
}
function refBusy(b,self){
  // bu rafineriyi hedefleyen/boşaltan diğer hasatçılar
  let n=0;
  for(const x of units)
    if(x!==self&&x.key==='harv'&&x.refT===b&&(x.state==='toRef'||x.state==='unload'))n++;
  return n;
}
function findRefinery(team,x,y,self){
  // en yakın DEĞİL, en uygun: mesafe + kuyruk cezası
  let best=null,bs=1e18;
  for(const b of buildings){
    if(b.team!==team||b.key!=='refinery')continue;
    const d=Math.hypot(b.x-x,b.y-y);
    const score=d+refBusy(b,self)*280; // dolu rıhtım = ~9 karo ceza
    if(score<bs){bs=score;best=b;}
  }
  if(self)self.refT=best;
  return best;
}
function dockPoint(b,u){
  // her hasatçıya rafineride ayrı rıhtım: yığılma biter
  const slot=(u?u.id%3:1)-1; // -1,0,+1
  return [b.x+slot*26, (b.ty+b.h)*TILE+20];
}
function findOreTile(x,y,self){
  let best=null,bd=1e18;
  const cx=Math.floor(x/TILE), cy=Math.floor(y/TILE);
  // diğer hasatçıların çalıştığı bölgeler (hedef + mevcut konum)
  const claims=[];
  if(self){
    for(const u of units){
      if(u===self||u.team!==self.team||u.key!=='harv')continue;
      if(u.oreTile)claims.push(u.oreTile);
      claims.push([Math.floor(u.x/TILE),Math.floor(u.y/TILE)]);
    }
  }
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const i=ty*MW+tx;
    if(ore[i]<=0||blockedGrid[i])continue; // ulaşılamaz cevheri hedefleme
    let d=(tx-cx)**2+(ty-cy)**2;
    // meslektaşın sahasına girme: 5 karo yarıçapında ağır ceza
    for(const c of claims){
      const dd=(tx-c[0])**2+(ty-c[1])**2;
      if(dd<25){d+=4000;break;}
    }
    if(d<bd){bd=d;best=[tx,ty];}
  }
  return best;
}
function damage(e,dmg,attacker){
  if(e.hp<=0)return;
  e.hp-=dmg; e.flash=0.15;
  if(e.team===PLAYER && simTime-lastAttackWarn>12){
    lastAttackWarn=simTime;
    eva('Üssümüz saldırı altında!','attack',12);
    notify('⚠ Kuvvetlerimiz saldırı altında!',true);
  }
  if(e.hp<=0) kill(e);
  else if(e.ent==='u'&&e.team!==PLAYER&&e.dmg>0&&attacker&&!e.target&&canHit(e,attacker)){
    e.target=attacker; e.state='attacking';
  }
}
function kill(e){
  explode(e.x,e.y,e.ent==='b'?30:14);
  sfx(e.ent==='b'?'boomBig':'boom');
  if(e.ent==='b'&&e.key==='pylon'&&LEVEL>=3&&l3){
    const kalan=buildings.filter(b=>b!==e&&b.key==='pylon').length;
    if(!l3.tech){
      l3.tech=true;
      notify('📡 Pilon enkazından dron teknolojisi söküldü — DRON ÜSSÜ açıldı!');
      eva('Dron teknolojisi ele geçirildi','tech',2);
      renderButtons();
    }
    notify('📶 Kontrol Pilonu yok edildi! Kalan: '+kalan+' — sürüler zayıflıyor.',true);
  }
  if(e.ent==='b'&&e.key==='ramp'&&LEVEL>=3&&l3){
    l3.rampT=-1;
    notify('☄ KIYAMET RAMPASI YOK EDİLDİ — geri sayım durduruldu!',true);
    eva('Rampa imha edildi. Füze tehdidi bitti, komutan.','rampdown',2);
  }
  if(e.ent==='b'&&e.key==='hive'&&LEVEL>=3){
    notify('🕸 ANA KOVAN SUSTU — dron üretimi durdu!',true);
    eva('Kovan çevrimdışı.','hivedown',2);
  }
  if(stats){ if(e.team===PLAYER)stats.lost++; else if(e.ent==='u')stats.killed++; else stats.razed++; }
  if(e.ent==='b'&&e.key==='nuclear'){
    // reaktör patlaması: çevreye ağır hasar!
    explode(e.x,e.y,60);
    for(const t of [...units,...buildings]){
      if(t===e||t.hp<=0)continue;
      const d=Math.hypot(t.x-e.x,t.y-e.y);
      if(d<TILE*4)damage(t,200*(1-d/(TILE*4)),null);
    }
    sfx('nuke');
    notify('☢ NÜKLEER SANTRAL PATLADI! Çevre bölge hasar aldı!',true);
    eva('Dikkat! Reaktör patlaması!','nuke',5);
  }
  if(e.ent==='b'){
    buildings=buildings.filter(b=>b!==e);
    rebuildBlocked();
    if(e.team===PLAYER){notify('💥 '+BUILD_TYPES[e.key].name+' yıkıldı!',true);}
  }else{
    units=units.filter(u=>u!==e);
    selected=selected.filter(u=>u!==e);
  }
  checkEnd();
}
function explode(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=30+Math.random()*140;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:40+Math.random()*90,z:0,
      life:0.4+Math.random()*0.5,max:0.9,grav:true,
      c:Math.random()<0.5?'#ffb340':(Math.random()<0.5?'#e05a2a':'#777')});
  }
  particles.push({x,y,vx:0,vy:0,vz:0,z:0,life:0.18,max:0.18,flash:true,c:'#fff2c0'});
}
function smoke(x,y,dark){
  particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,vz:26+Math.random()*14,z:0,
    life:1.6+Math.random(),max:2.4,smoke:true,
    c:dark?'#3a3a38':'#9a9a94'});
}

// ---------- üretim / güç ----------
function newQueues(){
  return { build:{items:[],prog:0,ready:null},
           barracks:{items:[],prog:0},
           factory:{items:[],prog:0},
           shipyard:{items:[],prog:0},
           heliport:{items:[],prog:0},
           dronebase:{items:[],prog:0} };
}
function heliCount(team){return units.filter(u=>u.team===team&&u.key==='heli').length;}
function heliportCount(team){return buildings.filter(b=>b.team===team&&b.key==='heliport').length;}
function buildTime(cost){ return Math.max(1.6, cost/140); }
function powerStats(team){
  let p=0,u=0;
  for(const b of buildings) if(b.team===team){
    const pw=BUILD_TYPES[b.key].power;
    if(pw>0)p+=pw; else u-=pw;
  }
  return [p,u];
}
function lowPower(team){
  const [p,u]=powerStats(team); return u>p;
}
function clickBuildBtn(key){
  if(key==='dronebase'&&(!l3||!l3.tech))return;
  const q=queues.build;
  if(q.ready===key){ placing={key}; return; }
  if(q.ready||q.items.length)return;
  const t=BUILD_TYPES[key];
  if(t.req&&!hasBuilding(PLAYER,t.req))return;
  if(credits[PLAYER]<t.cost){ eva('Yetersiz kaynak','nomoney',3); notify('Yetersiz kaynak!'); return; }
  credits[PLAYER]-=t.cost;
  q.items.push(key); q.prog=0;
  beep(600,0.06);
}
function clickUnitBtn(key){
  const t=UNIT_TYPES[key];
  const q=queues[t.prod];
  if(!hasBuilding(PLAYER,t.prod))return;
  if(key==='heli'){
    // her heliport için yalnızca 1 helikopter
    const queued=q.items.filter(k=>k==='heli').length;
    if(heliCount(PLAYER)+queued>=heliportCount(PLAYER)){
      notify('🚁 Her Heliport yalnızca 1 helikopter barındırır — yeni Heliport kurun.');
      beep(220,0.1,'square',0.05);
      return;
    }
  }
  if(q.items.length>=5)return;
  if(credits[PLAYER]<t.cost){ eva('Yetersiz kaynak','nomoney',3); notify('Yetersiz kaynak!'); return; }
  credits[PLAYER]-=t.cost;
  q.items.push(key);
  beep(600,0.06);
}
function cancelBuild(){
  const q=queues.build;
  if(placing){placing=null;return;}
  if(q.ready){ credits[PLAYER]+=BUILD_TYPES[q.ready].cost; q.ready=null; renderButtons(); return; }
  if(q.items.length){ credits[PLAYER]+=BUILD_TYPES[q.items[0]].cost; q.items=[]; q.prog=0; renderButtons(); }
}
function updateQueues(dt){
  const slow=lowPower(PLAYER)?0.5:1;
  const qb=queues.build;
  if(qb.items.length&&!qb.ready){
    qb.prog+=dt*slow/buildTime(BUILD_TYPES[qb.items[0]].cost);
    if(qb.prog>=1){ qb.ready=qb.items.shift(); qb.prog=0;
      sfx('ready');
      eva('İnşaat tamamlandı','done',2); notify('🏗 '+BUILD_TYPES[qb.ready].name+' hazır — yerleştirin.'); }
  }
  for(const cat of ['barracks','factory','shipyard','heliport','dronebase']){
    const q=queues[cat];
    if(!q.items.length)continue;
    if(!hasBuilding(PLAYER,cat)){
      for(const k of q.items) credits[PLAYER]+=UNIT_TYPES[k].cost;
      q.items=[]; q.prog=0; continue;
    }
    q.prog+=dt*slow/buildTime(UNIT_TYPES[q.items[0]].cost);
    if(q.prog>=1){
      const key=q.items.shift(); q.prog=0;
      spawnFrom(PLAYER,cat,key);
      sfx('ready');
      eva('Birim hazır','unit',2);
    }
  }
}
function spawnFrom(team,prodKey,unitKey){
  const b=buildings.find(x=>x.team===team&&x.key===prodKey);
  if(!b)return null;
  if(unitKey==='boat'){
    // tersanenin bitişiğindeki su karesinde doğar
    let spot=null;
    for(let r=1;r<=3&&!spot;r++)
      for(let y=b.ty-r;y<=b.ty+b.h+r&&!spot;y++)
        for(let x=b.tx-r;x<=b.tx+b.w+r&&!spot;x++)
          if(inMap(x,y)&&water[y*MW+x]&&!bridge[y*MW+x])spot=[x,y];
    if(!spot)return null;
    const u=addUnit(team,'boat',spot[0]*TILE+16,spot[1]*TILE+16);
    return u;
  }
  if(UNIT_TYPES[unitKey].domain==='air'){
    const u=addUnit(team,unitKey,b.x,b.y);
    orderMove(u,b.x+TILE*2,b.y+TILE*2,true);
    return u;
  }
  const sx=b.x, sy=(b.ty+b.h)*TILE+14;
  const u=addUnit(team,unitKey,sx,sy);
  orderMove(u,sx,sy+TILE*1.5,true);
  if(unitKey==='harv'){u.state='idle';u.path=null;}
  return u;
}

// ---------- emirler ----------
function orderMove(u,wx,wy,noAggro){
  if(u.domain==='air'){
    u.path=[{x:wx,y:wy}]; u.pi=0; u.target=null;
    u.dest={x:wx,y:wy}; u.state='moving'; u.noAggro=!!noAggro;
    return;
  }
  const p=astar(Math.floor(u.x/TILE),Math.floor(u.y/TILE),
                Math.floor(wx/TILE),Math.floor(wy/TILE),u.domain);
  u.path=p; u.pi=0; u.target=null;
  u.dest={x:wx,y:wy};
  u.state=p?'moving':'idle';
  u.noAggro=!!noAggro;
}
function canHit(u,target){
  if(target.ent==='u'&&target.domain==='air')return !!u.canAA;
  if(u.airOnly)return false; // avcı dron yalnızca hava hedefi vurur
  return true;
}
function orderAttack(u,target){
  if(u.dmg<=0){orderMove(u,target.x,target.y);return;}
  if(!canHit(u,target)){
    if(u.team===PLAYER)notify('⛔ '+UNIT_TYPES[u.key].name+' hava hedefini vuramaz — Roketçi gerekir!');
    return;
  }
  u.target=target; u.state='attacking'; u.path=null; u.repath=0;
}
function orderHarvest(u,tx,ty){
  u.oreTile=[tx,ty]; u.state='toOre';
  const p=astar(Math.floor(u.x/TILE),Math.floor(u.y/TILE),tx,ty);
  u.path=p; u.pi=0;
}
function nearestEnemy(u,maxDist){
  let best=null,bd=maxDist*maxDist;
  for(const e of units){
    if(e.team===u.team)continue;
    if(!canHit(u,e))continue;
    const d=(e.x-u.x)**2+(e.y-u.y)**2;
    if(d<bd){bd=d;best=e;}
  }
  for(const b of buildings){
    if(b.team===u.team)continue;
    const d=(b.x-u.x)**2+(b.y-u.y)**2;
    if(d<bd){bd=d;best=b;}
  }
  return best;
}
function moveAlong(u,dt){
  if(!u.path||u.pi>=u.path.length){u.path=null;return true;}
  const wp=u.path[u.pi];
  const dx=wp.x-u.x, dy=wp.y-u.y, d=Math.hypot(dx,dy);
  if(d<8){u.pi++; return u.pi>=u.path.length;}
  const sp=u.speed*dt;
  u.x+=dx/d*sp; u.y+=dy/d*sp;
  u.angle=Math.atan2(dy,dx);
  u.anim+=dt*8;
  return false;
}
function fireAt(u,t){
  u.cool=u.cd; u.muzzle=0.07;
  if(u.key==='arty'){
    // yay çizen büyük roket
    shells.push({x:u.x,y:u.y,target:t,dmg:u.dmg,speed:230,owner:u,
      arc:true,z:0,tot:Math.hypot(t.x-u.x,t.y-u.y),trav:0,splash:u.splash});
    sfx('rocketBig');
    return;
  }
  const isTank=(u.key==='tank'||u.key==='heavy'||u.key==='boat'||u.key==='heli'||u.ent==='b');
  if(isTank){
    shells.push({x:u.x,y:u.y,target:t,dmg:u.dmg,speed:340,owner:u});
    sfx(u.key==='heavy'?'cannonBig':'cannon');
  }else{
    tracers.push({x1:u.x,y1:u.y,x2:t.x,y2:t.y,life:0.07});
    damage(t,u.dmg,u);
    sfx(u.key==='rocket'?'rocketFire':'rifle');
  }
}
function updateMedic(u,dt){
  // elle verilen hareket emri önce biter
  if(u.state==='moving'){
    if(moveAlong(u,dt)){u.state='idle';u.noAggro=false;}
    u.healing=false;
    return;
  }
  if(u.healT&&(u.healT.hp<=0||u.healT.hp>=u.healT.maxHp))u.healT=null;
  u.rescan=(u.rescan||0)-dt;
  if(!u.healT&&u.rescan<=0){
    u.rescan=0.5;
    let best=null,bd=(TILE*10)**2;
    for(const e of units){
      if(e.team!==u.team||e===u)continue;
      if(!(e.key==='rifle'||e.key==='rocket'||e.key==='medic'))continue; // yalnızca piyade sınıfı
      if(e.hp>=e.maxHp)continue;
      const d=(e.x-u.x)**2+(e.y-u.y)**2;
      if(d<bd){bd=d;best=e;}
    }
    u.healT=best;
  }
  if(!u.healT){u.healing=false;return;}
  const d=Math.hypot(u.healT.x-u.x,u.healT.y-u.y);
  if(d<=TILE*1.35){
    u.path=null; u.healing=true;
    u.angle=Math.atan2(u.healT.y-u.y,u.healT.x-u.x);
    u.healT.hp=Math.min(u.healT.maxHp,u.healT.hp+9*dt);
    if(Math.random()<dt*3)
      particles.push({x:u.healT.x,y:u.healT.y,vx:0,vy:0,vz:22,z:8,life:0.6,max:0.6,heal:true,c:'#7ef07e'});
  }else{
    u.healing=false;
    u.repath-=dt;
    if(u.repath<=0||!u.path){
      u.repath=0.7;
      const p=astar(Math.floor(u.x/TILE),Math.floor(u.y/TILE),
                    Math.floor(u.healT.x/TILE),Math.floor(u.healT.y/TILE));
      u.path=p;u.pi=0;
    }
    if(u.path)moveAlong(u,dt);
  }
}
function updateUnit(u,dt){
  if(u.flash>0)u.flash-=dt;
  if(u.muzzle>0)u.muzzle-=dt;
  if(u.cool>0)u.cool-=dt;
  if(u.key==='harv'){ updateHarvester(u,dt); return; }
  if(u.key==='medic'){ updateMedic(u,dt); return; }
  if(u.target&&u.target.hp<=0){u.target=null; if(u.state==='attacking')u.state='idle';}
  if(u.state==='attacking'&&u.target){
    const d=Math.hypot(u.target.x-u.x,u.target.y-u.y);
    const reach=u.range+(u.target.ent==='b'?u.target.w*TILE*0.35:0);
    if(u.key==='sdrone'&&d<=reach+8){ // KAMİKAZE: çakıl ve patla
      const tgt=u.target;
      damage(tgt,u.dmg,u);
      for(const e of [...units,...buildings]){
        if(e===tgt||e===u||e.hp<=0)continue;
        if(Math.hypot(e.x-tgt.x,e.y-tgt.y)<30)damage(e,u.dmg*0.4,u);
      }
      explode(u.x,u.y,10);
      kill(u);
      return;
    }
    if(d<=reach){
      u.path=null;
      u.angle=Math.atan2(u.target.y-u.y,u.target.x-u.x);
      if(u.cool<=0)fireAt(u,u.target);
    }else{
      u.repath-=dt;
      if(u.repath<=0||!u.path){
        u.repath=0.9;
        if(u.domain==='air'){u.path=[{x:u.target.x,y:u.target.y}];u.pi=0;}
        else{
          const p=astar(Math.floor(u.x/TILE),Math.floor(u.y/TILE),
                        Math.floor(u.target.x/TILE),Math.floor(u.target.y/TILE),u.domain);
          u.path=p; u.pi=0;
        }
      }
      if(u.path)moveAlong(u,dt);
    }
    return;
  }
  if(u.state==='moving'){
    const done=moveAlong(u,dt);
    if(done){u.state='idle';u.noAggro=false;}
    if(!u.noAggro&&u.dmg>0){
      const e=nearestEnemy(u,u.range+TILE);
      if(e){orderAttack(u,e);return;}
    }
    return;
  }
  if(u.dmg>0){
    const e=nearestEnemy(u,TILE*6);
    if(e)orderAttack(u,e);
  }
}
function updateHarvester(u,dt){
  const ref=findRefinery(u.team,u.x,u.y,u);
  if(u.state==='idle'){
    if(u.load>=HARV_CAP*0.99&&ref){u.state='toRef';gotoRef(u,ref);return;}
    const t=findOreTile(u.x,u.y,u);
    if(t)orderHarvest(u,t[0],t[1]);
    return;
  }
  if(u.state==='toOre'){
    if(!u.path){u.state='harvesting';return;}
    if(moveAlong(u,dt))u.state='harvesting';
    return;
  }
  if(u.state==='harvesting'){
    const tx=Math.floor(u.x/TILE),ty=Math.floor(u.y/TILE);
    let idx=ty*MW+tx;
    if(ore[idx]<=0){
      const t=findOreTile(u.x,u.y,u);
      if(t&&(t[0]!==tx||t[1]!==ty)){orderHarvest(u,t[0],t[1]);}
      else if(u.load>0&&ref){u.state='toRef';gotoRef(u,ref);} // kısmi yükü boşalt
      else u.state='idle';
      return;
    }
    const take=Math.min(HARV_RATE*dt,ore[idx],HARV_CAP-u.load);
    ore[idx]-=take; u.load+=take;
    if(ore[idx]<=0)ore[idx]=0;
    if(u.load>=HARV_CAP*0.99){
      const r=findRefinery(u.team,u.x,u.y,u);
      if(r){u.state='toRef';gotoRef(u,r);}
      else u.state='idle';
    }
    return;
  }
  if(u.state==='toRef'){
    const r=u.refT&&buildings.includes(u.refT)?u.refT:findRefinery(u.team,u.x,u.y,u);
    if(!r){u.state='idle';return;}
    if(!u.path||moveAlong(u,dt)){
      const [dx2,dy2]=dockPoint(r,u);
      if(Math.hypot(dx2-u.x,dy2-u.y)<TILE*1.4||Math.hypot(r.x-u.x,r.y-u.y)<TILE*2.2){
        u.state='unload';u.unl=0;
      }
      else gotoRef(u,r);
    }
    return;
  }
  if(u.state==='unload'){
    u.unl=(u.unl||0)+dt;
    if(u.unl>=1.2){
      credits[u.team]+=Math.round(u.load);
      if(u.team===PLAYER)sfx('cash');
      u.load=0; u.state='idle';
    }
  }
}
function gotoRef(u,r){
  u.refT=r;
  const [dx2,dy2]=dockPoint(r,u);
  const p=astar(Math.floor(u.x/TILE),Math.floor(u.y/TILE),
                Math.floor(dx2/TILE),Math.floor(dy2/TILE),u.domain);
  if(p){u.path=p;u.pi=0;return;}
}
function gotoRefOld(u,r){
  const p=astar(Math.floor(u.x/TILE),Math.floor(u.y/TILE), r.tx+1, r.ty+r.h);
  u.path=p;u.pi=0;
  if(!p)u.state='idle';
}
function updateRepairs(dt){
  // bina tamiri (🔧 ile işaretlenenler)
  for(const b of buildings){
    if(!b.repairing)continue;
    if(b.hp>=b.maxHp){b.repairing=false;continue;}
    const amt=Math.min(REPAIR_RATE*dt, b.maxHp-b.hp);
    const cost=amt*REPAIR_COST;
    if(credits[b.team]<cost)continue; // para yoksa beklet
    credits[b.team]-=cost; b.hp+=amt;
    if(Math.random()<dt*3)particles.push({x:b.x+(Math.random()*b.w*TILE-b.w*16),
      y:b.y+(Math.random()*b.h*TILE-b.h*16),vx:0,vy:0,vz:18,z:6,
      life:0.7,max:0.7,heal:true,c:'#7ef07e'});
  }
  // tamir istasyonları: yakındaki dost birimleri iyileştir
  for(const d of buildings){
    if(d.key!=='depot')continue;
    const rate=lowPower(d.team)?HEAL_RATE*0.5:HEAL_RATE;
    for(const u of units){
      if(u.team!==d.team||u.hp>=u.maxHp)continue;
      if(Math.hypot(u.x-d.x,u.y-d.y)>HEAL_RANGE*TILE)continue;
      const amt=Math.min(rate*dt, u.maxHp-u.hp);
      const cost=amt*HEAL_COST;
      if(credits[d.team]<cost)continue;
      credits[d.team]-=cost; u.hp+=amt;
      if(Math.random()<dt*2.5)particles.push({x:u.x,y:u.y,vx:0,vy:0,vz:22,z:8,
        life:0.6,max:0.6,heal:true,c:'#7ef07e'});
    }
  }
}
function updateDefense(b,dt){
  if(b.cool>0)b.cool-=dt;
  if(b.muzzle>0)b.muzzle-=dt;
  if(lowPower(b.team))return;
  const t=BUILD_TYPES[b.key];
  if(b.target&&(b.target.hp<=0||Math.hypot(b.target.x-b.x,b.target.y-b.y)>t.range*TILE))b.target=null;
  if(!b.target){
    let best=null,bd=(t.range*TILE)**2;
    for(const e of units){
      if(e.team===b.team)continue;
      const isAir=e.domain==='air';
      if(b.key==='sam'){ if(!isAir)continue; }        // SAM yalnızca hava
      else if(isAir)continue;                          // taret/tesla havayı vuramaz
      const d=(e.x-b.x)**2+(e.y-b.y)**2;
      if(d<bd){bd=d;best=e;}
    }
    b.target=best;
  }
  if(b.target){
    b.angle=Math.atan2(b.target.y-b.y,b.target.x-b.x);
    if(b.cool<=0){
      b.cool=t.cd; b.muzzle=0.07;
      if(b.key==='tesla'){
        // anlık yıldırım: zigzag iz + doğrudan hasar
        tracers.push({x1:b.x,y1:b.y,x2:b.target.x,y2:b.target.y,life:0.14,tesla:true});
        damage(b.target,t.dmg,b);
        explode(b.target.x,b.target.y,4);
        sfx('tesla');
      }else{
        shells.push({x:b.x,y:b.y,target:b.target,dmg:t.dmg,speed:b.key==='sam'?430:360,owner:b});
        sfx(b.key==='sam'?'rocketFire':'cannon');
      }
    }
  }
}
function updateShells(dt){
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i];
    if(!s.target||s.target.hp<=0){shells.splice(i,1);continue;}
    const dx=s.target.x-s.x, dy=s.target.y-s.y, d=Math.hypot(dx,dy);
    const step=s.speed*dt;
    if(d<=step){
      damage(s.target,s.dmg,s.owner);
      if(s.splash){ // alan hasarı: yakın çevreye yarım hasar
        for(const e of [...units,...buildings]){
          if(e===s.target||e.hp<=0)continue;
          if(e.ent==='u'&&e.domain==='air')continue;
          if(Math.hypot(e.x-s.target.x,e.y-s.target.y)<s.splash)
            damage(e,s.dmg*0.5,s.owner);
        }
        explode(s.target.x,s.target.y,14);
      }else explode(s.target.x,s.target.y,5);
      shells.splice(i,1);
    }else{
      s.x+=dx/d*step; s.y+=dy/d*step;
      if(s.arc){
        s.trav+=step;
        s.z=Math.sin(Math.min(1,s.trav/s.tot)*Math.PI)*Math.min(90,s.tot*0.3);
        if(Math.random()<0.5)smoke(s.x,s.y-0,false); // roket dumanı izi
      }
    }
  }
}
function separation(){
  for(let i=0;i<units.length;i++){
    const a=units[i];
    for(let j=i+1;j<units.length;j++){
      const b=units[j];
      const dx=b.x-a.x,dy=b.y-a.y;
      const min=(a.size+b.size)*0.9;
      const d2=dx*dx+dy*dy;
      if(d2<min*min&&d2>0.01){
        const d=Math.sqrt(d2), push=(min-d)/2;
        const nx=dx/d,ny=dy/d;
        a.x-=nx*push;a.y-=ny*push;
        b.x+=nx*push;b.y+=ny*push;
      }
    }
    a.x=Math.max(8,Math.min(WORLD_W-8,a.x));
    a.y=Math.max(8,Math.min(WORLD_H-8,a.y));
  }
}

// ---------- sis ----------
function revealAround(x,y,team,r){
  if(team!==PLAYER)return;
  const cx=Math.floor(x/TILE),cy=Math.floor(y/TILE);
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r)continue;
    const nx=cx+dx,ny=cy+dy;
    if(inMap(nx,ny))explored[ny*MW+nx]=1;
  }
}
let fogTimer=0;
function updateFog(dt){
  fogTimer-=dt;
  if(fogTimer>0)return;
  fogTimer=0.5;
  for(const u of units)if(u.team===PLAYER){
    let r=u.key==='harv'?9:(u.key==='rdrone'?12:6);
    if(l3&&l3.storm)r=Math.max(3,Math.round(r*0.55)); // tipi görüşü kısar
    revealAround(u.x,u.y,PLAYER,r);
  }
  for(const b of buildings)if(b.team===PLAYER)revealAround(b.x,b.y,PLAYER,7);
}

// ---------- AI (v1.1 dengesi) ----------
function newAI(team){
  return {team,prodTimer:8+Math.random()*4,waveTimer:80+Math.random()*15,waveSize:2,alt:0,rebuildHarv:0};
}
function missileStrike(){
  const targets=buildings.filter(b=>b.team===PLAYER);
  if(!targets.length)return;
  const t=buildings.find(b=>b.team===PLAYER&&b.key==='conyard')||targets[Math.floor(Math.random()*targets.length)];
  const R=TILE*5.5;
  for(const e of [...units,...buildings]){
    if(e.hp<=0||e.team!==PLAYER&&e.ent==='u'&&false)continue;
    const d=Math.hypot(e.x-t.x,e.y-t.y);
    if(d<R)damage(e,380*(1-d/R),null);
  }
  for(let k=0;k<5;k++)explode(t.x+(Math.random()*120-60),t.y+(Math.random()*120-60),40);
  sfx('nuke');
  if(l3)l3.bolt=1.4;
  notify('☄ KIYAMET FÜZESİ İSABET ETTİ! Rampa yeniden doluyor...',true);
  eva('Füze isabeti! Ağır hasar aldık!','strike',3);
}
function updateAI3(a,dt){
  const T=1;
  credits[T]+=14*dt;
  for(const b of buildings)
    if(b.team===T&&!b.repairing&&b.hp<b.maxHp*0.6&&credits[T]>500
       &&b.key!=='ramp'&&b.key!=='hive'&&b.key!=='pylon') // otonom yapılar tamir EDİLEMEZ — hasar kalıcı!
      b.repairing=true;
  // kara kuvveti: fabrika ara sıra tank basar
  a.prodTimer-=dt;
  if(a.prodTimer<=0){
    a.prodTimer=26;
    if(credits[T]>=700&&hasBuilding(T,'factory')){credits[T]-=700;spawnFrom(T,'factory','tank');}
  }
  // SÜRÜ DALGALARI: pilon sayısı gücü belirler
  const py=buildings.filter(b=>b.team===T&&b.key==='pylon').length;
  a.waveTimer-=dt;
  if(a.waveTimer<=0){
    a.waveTimer=46-py*6+Math.random()*6;
    const n=3+py*3;
    const hive=buildings.find(b=>b.team===T&&b.key==='hive')||buildings.find(b=>b.team===T);
    if(hive&&credits[T]>=n*60){
      credits[T]-=n*60;
      const pTargets=[...buildings.filter(b=>b.team===PLAYER),...units.filter(u=>u.team===PLAYER)];
      for(let k=0;k<n;k++){
        const d=addUnit(T,'sdrone',hive.x+(Math.random()*80-40),hive.y+(Math.random()*60-30));
        const tg=pTargets[Math.floor(Math.random()*pTargets.length)];
        if(tg)orderAttack(d,tg);
      }
      eva('Dron sürüsü tespit edildi','swarm',18);
      notify('🐝 UYARI: '+n+' birimlik dron sürüsü yaklaşıyor!',true);
    }
  }
  // AVCI DRONLAR: oyuncunun hava araçlarına
  a.hunt=(a.hunt||0)-dt;
  if(a.hunt<=0){
    a.hunt=20;
    const pAir=units.filter(u=>u.team===PLAYER&&u.domain==='air');
    if(pAir.length&&credits[T]>=600){
      credits[T]-=600;
      const hive=buildings.find(b=>b.team===T&&b.key==='hive')||buildings.find(b=>b.team===T);
      for(let k=0;k<Math.min(2,pAir.length);k++){
        const h=addUnit(T,'hdrone',hive.x+40*k,hive.y);
        orderAttack(h,pAir[Math.floor(Math.random()*pAir.length)]);
      }
      notify('🦅 Avcı dronlar havalandı — hava araçlarını koru!',true);
    }
  }
  // KOVAN ÖFKESİ: hasar aldıkça sürü kusar
  a.rageCd=(a.rageCd||0)-dt;
  const hv=buildings.find(b=>b.team===T&&b.key==='hive');
  if(hv){
    if(a.hiveHp===undefined)a.hiveHp=hv.hp;
    if(a.hiveHp-hv.hp>140&&a.rageCd<=0){
      a.rageCd=8;
      const near=units.filter(u=>u.team===PLAYER);
      for(let k=0;k<4;k++){
        const d=addUnit(T,'sdrone',hv.x+(Math.random()*60-30),hv.y+(Math.random()*60-30));
        const tg=near.length?near[Math.floor(Math.random()*near.length)]:buildings.find(b=>b.team===PLAYER);
        if(tg)orderAttack(d,tg);
      }
      notify('🕸 Kovan öfkelendi — savunma sürüsü!',true);
    }
    a.hiveHp=hv.hp;
  }
  // KIYAMET RAMPASI GERİ SAYIMI
  const ramp=buildings.find(b=>b.team===T&&b.key==='ramp');
  if(ramp&&l3&&l3.rampT>=0){
    l3.rampT-=dt;
    if(l3.rampT<=300&&!l3.w5){l3.w5=true;eva('Füze rampası yüzde seksen dolu. Beş dakika.','w5',2);notify('☄ 5 DAKİKA: Rampa doluyor!',true);}
    if(l3.rampT<=60&&!l3.w1){l3.w1=true;eva('Son bir dakika! Rampayı durdurun!','w1',2);notify('☄ 60 SANİYE!',true);}
    if(l3.rampT<=0){
      missileStrike();
      l3.rampT=l3.total; l3.w5=false; l3.w1=false;
    }
  }
}
function updateAI(a,dt){
  if(LEVEL>=3){updateAI3(a,dt);return;}
  const T=a.team;
  credits[T]+=(simTime<180?4:(simTime<420?10:14))*dt;
  a.prodTimer-=dt;
  if(a.prodTimer<=0){
    a.prodTimer=simTime<150?5.5:(simTime<330?3.5:2.4);
    produceAIUnit(a);
  }
  if(!units.some(u=>u.team===T&&u.key==='harv')){
    a.rebuildHarv-=dt;
    if(a.rebuildHarv<=0&&credits[T]>=UNIT_TYPES.harv.cost&&hasBuilding(T,'factory')){
      credits[T]-=UNIT_TYPES.harv.cost;
      spawnFrom(T,'factory','harv');
      a.rebuildHarv=20;
    }
  }
  for(const b of buildings)
    if(b.team===T&&!b.repairing&&b.hp<b.maxHp*0.6&&credits[T]>400)
      b.repairing=true;
  a.waveTimer-=dt;
  if(a.waveTimer<=0){
    a.waveTimer=simTime<360?45:30;
    const army=units.filter(u=>u.team===T&&u.dmg>0&&u.state!=='attacking');
    if(army.length>=a.waveSize){
      // FFA: en yakın DÜŞMAN üssü hedeflenir (oyuncu veya rakip AI!)
      const foes=buildings.filter(b=>b.team!==T);
      if(foes.length){
        const home=buildings.find(b=>b.team===T&&b.key==='conyard')||buildings.find(b=>b.team===T);
        let t=foes[0],bd=1e18;
        if(home)for(const f of foes){
          const d=(f.x-home.x)**2+(f.y-home.y)**2;
          if(d<bd){bd=d;t=f;}
        }
        const cap=simTime<300?3:(simTime<600?7:12);
        const squad=army.slice(0,cap);
        for(const u of squad){
          orderMove(u,t.x+(Math.random()*80-40),t.y+(Math.random()*80-40));
        }
        a.waveSize=Math.min(12,a.waveSize+1);
        if(t.team===PLAYER){
          eva('Düşman kuvvetleri yaklaşıyor','wave',20);
          notify('📡 İstihbarat: Düşman saldırı dalgası tespit edildi!',true);
        }
      }
    }
  }
}
function produceAIUnit(a){
  const T=a.team;
  const armySize=units.filter(u=>u.team===T&&u.dmg>0).length;
  const armyCap=simTime<300?8:(simTime<600?12:16);
  if(armySize>=armyCap)return;
  const mins=(simTime)/60;
  let key;
  const roll=a.alt%4;
  if(roll===2&&hasBuilding(T,'factory')&&simTime>170) key=(mins>8&&Math.random()<0.4)?'heavy':'tank';
  else if(roll===3&&LEVEL>=2&&hasBuilding(T,'factory')&&simTime>240&&Math.random()<0.5) key='arty';
  else if(roll===3&&LEVEL>=2&&hasBuilding(T,'heliport')&&simTime>300&&
          units.filter(u=>u.team===T&&u.key==='heli').length<buildings.filter(b=>b.team===T&&b.key==='heliport').length)
    key='heli';
  else if(hasBuilding(T,'barracks')){
    const r2=Math.random();
    key=r2<0.55?'rifle':(r2<0.88?'rocket':'medic');
  }
  else if(hasBuilding(T,'factory')) key='tank';
  else return;
  const cost=UNIT_TYPES[key].cost;
  if(credits[T]<cost)return;
  credits[T]-=cost;
  spawnFrom(T,UNIT_TYPES[key].prod,key);
  a.alt++;
}

<script>
"use strict";
/* =====================================================================
   BÖLÜM 2 — İzometrik girdi + çizim motoru + oyun akışı
   ===================================================================== */

// ---------- GİRDİ (izometrik dönüşümlü) ----------
let mouse={x:0,y:0,down:false,dragX:0,dragY:0,dragging:false};
let keys={};
let zoom=1, pinch=null;
function setZoom(z,px,py){
  z=Math.max(0.5,Math.min(2.2,z));
  if(px===undefined){px=cvs.width/2;py=cvs.height/2;}
  const ix=cam.x+px/zoom, iy=cam.y+py/zoom; // imleç altındaki izo nokta sabit kalsın
  zoom=z;
  cam.x=ix-px/zoom; cam.y=iy-py/zoom;
  clampCam();
}
let repairMode=false;
function setRepairMode(v){
  repairMode=v;
  const b=$('fixBtn'); if(b)b.classList.toggle('on',repairMode);
  if(repairMode){placing=null; notify('🔧 Tamir modu: onarılacak binaya tıklayın. (ESC: çık)');}
}
function repairClick(wx,wy){
  const ent=pickEntity(wx,wy);
  if(ent&&ent.ent==='b'&&ent.team===PLAYER){
    if(ent.hp>=ent.maxHp){notify('Bu bina zaten sağlam.');return;}
    ent.repairing=!ent.repairing;
    beep(ent.repairing?820:300,0.08,'sine',0.08);
    if(ent.repairing)eva('Tamir ediliyor','repair',4);
  }
}
function screenToWorld(px,py){
  const sx=px/zoom+cam.x, sy=py/zoom+cam.y;
  return [unisoX(sx,sy), unisoY(sx,sy)];
}
function entScreen(e){ // varlığın ekran konumu (fiziksel piksel)
  return [(isoX(e.x,e.y)-cam.x)*zoom, (isoY(e.x,e.y)-cam.y)*zoom];
}
function pickEntity(wx,wy){
  // birimler: ekran uzayında yakala (izoda daha doğal)
  const sx=isoX(wx,wy), sy=isoY(wx,wy);
  let best=null,bd=1e9;
  for(const u of units){
    const ux=isoX(u.x,u.y), uy=isoY(u.x,u.y)-8;
    const d=(ux-sx)**2+((uy-sy)*1.6)**2;
    if(d<(u.size+9)**2&&d<bd){bd=d;best=u;}
  }
  if(best)return best;
  for(const b of buildings){
    if(wx>=b.tx*TILE&&wx<(b.tx+b.w)*TILE&&wy>=b.ty*TILE&&wy<(b.ty+b.h)*TILE)return b;
  }
  return null;
}
function commandAt(wx,wy){
  if(!selected.length)return;
  const ent=pickEntity(wx,wy);
  const harvs=selected.filter(u=>u.key==='harv');
  const combat=selected.filter(u=>u.key!=='harv');
  const tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE);
  if(ent&&ent.team!==PLAYER){
    for(const u of combat)orderAttack(u,ent);
    for(const u of harvs)orderMove(u,wx,wy);
    unitVoice('atk');
  }else if(inMap(tx,ty)&&ore[ty*MW+tx]>0&&harvs.length){
    for(const u of harvs)orderHarvest(u,tx,ty);
    for(const u of combat)orderMove(u,wx,wy);
    unitVoice('move');
  }else{
    let i=0;
    for(const u of selected){
      const ang=i*2.4, r=6*Math.sqrt(i);
      // zemine sağ tık = kesin hareket emri: savaşı bırak, geri çekil
      orderMove(u,wx+Math.cos(ang)*r,wy+Math.sin(ang)*r,true);
      i++;
    }
    unitVoice('move');
  }
  updateSelInfo();
}
function selectBox(x1,y1,x2,y2){ // ekran koordinatları
  const minx=Math.min(x1,x2),maxx=Math.max(x1,x2);
  const miny=Math.min(y1,y2),maxy=Math.max(y1,y2);
  selected=units.filter(u=>{
    if(u.team!==PLAYER)return false;
    const [sx,sy]=entScreen(u);
    return sx>=minx-8&&sx<=maxx+8&&sy>=miny-16&&sy<=maxy+8;
  });
  if(selected.length)unitVoice('sel');
  updateSelInfo();
}
// sınıf grupları: ⚔'a her dokunuş sıradaki dolu gruba geçer
const SEL_GROUPS=[
  {ic:'⚔', ad:'TÜM ORDU',   f:u=>u.dmg>0||u.key==='medic'},
  {ic:'🪖',ad:'PİYADE',      f:u=>u.key==='rifle'||u.key==='rocket'||u.key==='medic'},
  {ic:'🛡',ad:'ZIRHLI',      f:u=>u.key==='tank'||u.key==='heavy'},
  {ic:'🎇',ad:'TOPÇU',       f:u=>u.key==='arty'},
  {ic:'✈', ad:'HAVA GÜCÜ',   f:u=>u.domain==='air'&&u.dmg>0},
  {ic:'⚓',ad:'DONANMA',     f:u=>u.key==='boat'}
];
let selGroupIdx=0, selGroupTime=0;
function selectAllCombat(){
  const now=Date.now();
  if(now-selGroupTime>3500)selGroupIdx=0; // 3.5 sn geçtiyse baştan: TÜM ORDU
  selGroupTime=now;
  // sıradaki DOLU grubu bul
  for(let tries=0;tries<SEL_GROUPS.length;tries++){
    const g=SEL_GROUPS[selGroupIdx%SEL_GROUPS.length];
    selGroupIdx++;
    const list=units.filter(u=>u.team===PLAYER&&g.f(u));
    if(list.length){
      selected=list;
      unitVoice('sel');
      notify(g.ic+' '+g.ad+': '+list.length+' birim seçildi. (tekrar dokun: sıradaki sınıf)');
      const btn=$('allBtn'); if(btn)btn.textContent=g.ic;
      updateSelInfo();
      return;
    }
  }
  notify('Seçilecek savaş birimi yok.');
}
function updateSelInfo(){
  const el=$('selinfo');
  if(!selected.length){el.textContent='Birim seçilmedi.';return;}
  const counts={};
  for(const u of selected)counts[u.key]=(counts[u.key]||0)+1;
  el.innerHTML=Object.entries(counts).map(([k,n])=>
    UNIT_TYPES[k].ic+' '+UNIT_TYPES[k].name+' ×'+n).join('<br>');
}
function setupInput(){
  cvs.addEventListener('contextmenu',e=>e.preventDefault());
  cvs.addEventListener('mousedown',e=>{
    const r=cvs.getBoundingClientRect();
    const px=e.clientX-r.left, py=e.clientY-r.top;
    if(e.button===0){
      if(placing){ tryPlace(px,py); return; }
      if(repairMode){
        const [wx,wy]=screenToWorld(px,py);
        repairClick(wx,wy); return;
      }
      mouse.down=true; mouse.dragging=false;
      mouse.dragX=px; mouse.dragY=py;
    }else if(e.button===2){
      if(placing){placing=null;return;}
      const [wx,wy]=screenToWorld(px,py);
      commandAt(wx,wy);
    }
  });
  cvs.addEventListener('mousemove',e=>{
    const r=cvs.getBoundingClientRect();
    mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
    if(mouse.down&&Math.hypot(mouse.x-mouse.dragX,mouse.y-mouse.dragY)>6)mouse.dragging=true;
  });
  cvs.addEventListener('mouseup',e=>{
    if(e.button!==0||!mouse.down)return;
    mouse.down=false;
    if(mouse.dragging){
      selectBox(mouse.dragX,mouse.dragY,mouse.x,mouse.y);
    }else{
      const [wx,wy]=screenToWorld(mouse.x,mouse.y);
      const ent=pickEntity(wx,wy);
      if(ent&&ent.ent==='u'&&ent.team===PLAYER){selected=[ent];unitVoice('sel');}
      else selected=[];
      updateSelInfo();
    }
    mouse.dragging=false;
  });
  cvs.addEventListener('mouseleave',()=>{mouse.x=-100;mouse.y=-100;});
  cvs.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=cvs.getBoundingClientRect();
    setZoom(zoom*Math.pow(1.0016,-e.deltaY), e.clientX-r.left, e.clientY-r.top);
  },{passive:false});

  let touchStart=null;
  cvs.addEventListener('touchstart',e=>{
    e.preventDefault();
    const r=cvs.getBoundingClientRect();
    if(e.touches.length===2){
      const t1=e.touches[0],t2=e.touches[1];
      const mx=(t1.clientX+t2.clientX)/2-r.left, my=(t1.clientY+t2.clientY)/2-r.top;
      pinch={d0:Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY),
             z0:zoom, ix:cam.x+mx/zoom, iy:cam.y+my/zoom};
      touchStart=null;
      return;
    }
    const t=e.touches[0];
    touchStart={x:t.clientX-r.left,y:t.clientY-r.top,t:Date.now()};
    mouse.x=touchStart.x;mouse.y=touchStart.y;
  },{passive:false});
  cvs.addEventListener('touchmove',e=>{
    e.preventDefault();
    const r=cvs.getBoundingClientRect();
    if(e.touches.length===2&&pinch){
      const t1=e.touches[0],t2=e.touches[1];
      const d=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
      const mx=(t1.clientX+t2.clientX)/2-r.left, my=(t1.clientY+t2.clientY)/2-r.top;
      zoom=Math.max(0.5,Math.min(2.2,pinch.z0*d/pinch.d0));
      cam.x=pinch.ix-mx/zoom; cam.y=pinch.iy-my/zoom; // orta nokta sabit: zoom + kaydırma birlikte
      clampCam();
      return;
    }
    const t=e.touches[0];
    const nx=t.clientX-r.left,ny=t.clientY-r.top;
    if(touchStart&&!placing){
      cam.x-=(nx-mouse.x)/zoom; cam.y-=(ny-mouse.y)/zoom;
      clampCam();
      if(Math.hypot(nx-touchStart.x,ny-touchStart.y)>8)touchStart.moved=true;
    }
    mouse.x=nx;mouse.y=ny;
  },{passive:false});
  cvs.addEventListener('touchend',e=>{
    e.preventDefault();
    if(pinch){
      if(e.touches.length<2){
        pinch=null;
        if(e.touches.length===1){
          const r=cvs.getBoundingClientRect();
          const t=e.touches[0];
          mouse.x=t.clientX-r.left; mouse.y=t.clientY-r.top;
          touchStart={x:mouse.x,y:mouse.y,t:Date.now(),moved:true};
        }
      }
      return;
    }
    if(!touchStart)return;
    if(!touchStart.moved){
      const px=touchStart.x,py=touchStart.y;
      if(placing){tryPlace(px,py);}
      else if(repairMode){
        const [wx,wy]=screenToWorld(px,py);
        repairClick(wx,wy);
      }
      else{
        const [wx,wy]=screenToWorld(px,py);
        const ent=pickEntity(wx,wy);
        if(ent&&ent.ent==='u'&&ent.team===PLAYER){selected=[ent];unitVoice('sel');updateSelInfo();}
        else if(selected.length){commandAt(wx,wy);}
        else{selected=[];updateSelInfo();}
      }
    }
    touchStart=null;
  },{passive:false});

  window.addEventListener('keydown',e=>{
    keys[e.key]=true;
    if(e.key==='Escape'){cancelBuild();setRepairMode(false);selected=[];updateSelInfo();}
    if(e.key==='p'||e.key==='P')togglePause();
    if(e.key==='t'||e.key==='T')setRepairMode(!repairMode);
    if(e.key==='e'||e.key==='E')selectAllCombat();
    if(e.key==='+'||e.key==='=')setZoom(zoom*1.15);
    if(e.key==='-'||e.key==='_')setZoom(zoom/1.15);
  });
  window.addEventListener('keyup',e=>{keys[e.key]=false;});

  const mmMove=e=>{
    const r=mmCvs.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    const wx=cx/r.width*WORLD_W, wy=cy/r.height*WORLD_H;
    cam.x=isoX(wx,wy)-cvs.width/(2*zoom);
    cam.y=isoY(wx,wy)-cvs.height/(2*zoom);
    clampCam();
  };
  let mmDown=false;
  mmCvs.addEventListener('mousedown',e=>{mmDown=true;mmMove(e);});
  window.addEventListener('mousemove',e=>{if(mmDown)mmMove(e);});
  window.addEventListener('mouseup',()=>{mmDown=false;});
  mmCvs.addEventListener('touchstart',e=>{e.preventDefault();mmMove(e);},{passive:false});
  mmCvs.addEventListener('touchmove',e=>{e.preventDefault();mmMove(e);},{passive:false});
}
function tryPlace(px,py){
  const t=BUILD_TYPES[placing.key];
  const [wx,wy]=screenToWorld(px,py);
  const tx=Math.floor(wx/TILE - t.w/2 + 0.5);
  const ty=Math.floor(wy/TILE - t.h/2 + 0.5);
  if(canPlace(placing.key,tx,ty,PLAYER)){
    addBuilding(PLAYER,placing.key,tx,ty);
    queues.build.ready=null;
    placing=null;
    beep(300,0.15,'sine',0.1);
    renderButtons();
  }else{
    notify('Buraya inşa edilemez.');
    beep(200,0.12,'square',0.05);
  }
}
function clampCam(){
  const vw=cvs.width/zoom, vh=cvs.height/zoom;
  const minX=-(MH*TILE)-40, maxX=MW*TILE+40-vw;
  const minY=-40, maxY=(MW+MH)*(IH/2)+40-vh;
  cam.x=Math.max(minX,Math.min(maxX,cam.x));
  cam.y=Math.max(minY,Math.min(maxY,cam.y));
}
function updateCamera(dt){
  const sp=560*dt/zoom;
  if(keys['ArrowLeft']||keys['a'])cam.x-=sp;
  if(keys['ArrowRight']||keys['d'])cam.x+=sp;
  if(keys['ArrowUp']||keys['w'])cam.y-=sp;
  if(keys['ArrowDown']||keys['s'])cam.y+=sp;
  const m=24;
  if(mouse.x>=0&&mouse.y>=0&&!('ontouchstart' in window)){
    if(mouse.x<m)cam.x-=sp;
    if(mouse.x>cvs.width-m)cam.x+=sp;
    if(mouse.y<m)cam.y-=sp;
    if(mouse.y>cvs.height-m)cam.y+=sp;
  }
  clampCam();
}

function refreshButtonProgress(){
  const box=$('buttons');
  for(const btn of box.children){
    const key=btn.dataset.key;
    const prog=btn.querySelector('.prog');
    if(!prog)continue;
    if(btn.dataset.kind==='b'){
      const q=queues.build;
      prog.style.width=(q.items[0]===key? q.prog*100:0)+'%';
      btn.classList.toggle('ready',q.ready===key);
      const t=BUILD_TYPES[key];
      btn.disabled=t.req&&!hasBuilding(PLAYER,t.req);
    }else{
      const t=UNIT_TYPES[key];
      const q=queues[t.prod];
      const n=q.items.filter(k=>k===key).length;

      if(qn)qn.textContent=n>0?'×'+n:'';

    }
