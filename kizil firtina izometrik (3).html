function diamondPath(c,sx,sy){ // üst tepe (sx,sy)
  c.beginPath();
  c.moveTo(sx,sy);
  c.lineTo(sx+IW/2,sy+IH/2);
  c.lineTo(sx,sy+IH);
  c.lineTo(sx-IW/2,sy+IH/2);
  c.closePath();
}
// ---- arazi ön-çizimi (bir kez) ----
function prerenderTerrain(){
  if(!terrChunks.length)buildTerrChunks();
  if(!exploredA||exploredA.length!==MW*MH)buildFogCanvas();
  buildShore();
  buildSandLayer();
  for(const ch of terrChunks){
    ch.ctx.clearRect(0,0,ch.cvs.width,ch.cvs.height);
    ch.ctx.save();
    ch.ctx.translate(-ch.x,0);
    paintTerrain(ch.ctx);
    ch.ctx.restore();
  }
}
function paintTerrain(c){
  const grass=LEVEL>=3
    ?['#cdd6dc','#c6d0d7','#d4dde2','#c0cbd3']
    :['#4a5a33','#46562f','#4e5e37','#43532d'];
  for(let s=0;s<=MW+MH-2;s++){ // arkadan öne
    for(let tx=Math.max(0,s-MH+1);tx<=Math.min(MW-1,s);tx++){
      const ty=s-tx;
      const [ix,iy]=tileIso(tx,ty);
      const sx=ix+ISO_X0, sy=iy+ISO_Y0;
      const i=ty*MW+tx;
      if(water[i]){
        if(LEVEL>=3){ // DONMUŞ NEHİR: buz + çatlaklar
          c.fillStyle='#aecbd8';
          diamondPath(c,sx,sy);c.fill();
          c.fillStyle='rgba(255,255,255,.25)';
          c.beginPath();c.ellipse(sx,sy+IH/2,20,7,0,0,7);c.fill();
          const hc=hash2(tx*5,ty*9);
          if(hc>0.5){
            c.strokeStyle='rgba(110,150,168,.6)';c.lineWidth=1;
            c.beginPath();
            c.moveTo(sx-14+hc*8,sy+8);
            c.lineTo(sx+2,sy+IH/2+(hc*6-3));
            c.lineTo(sx+15-hc*6,sy+IH-8);
            c.stroke();
          }
          continue;
        }
        // su: derin merkez, açık kıyı
        const nearLand=(!water[i-1]||!water[i+1]||!water[i-MW]||!water[i+MW]);
        c.fillStyle=nearLand?'#3d6a78':'#2c5666';
        diamondPath(c,sx,sy);c.fill();
        if(bridge[i]){
          // ahşap köprü: kalas dokusu + korkuluk direkleri
          c.fillStyle='#7a5b36';
          diamondPath(c,sx,sy);c.fill();
          c.strokeStyle='rgba(70,48,24,.85)';c.lineWidth=1.2;
          for(let p=1;p<=3;p++){
            const f=p/4;
            c.beginPath();
            c.moveTo(sx-IW/2*f,        sy+IH/2*f);
            c.lineTo(sx+IW/2*(1-f),    sy+IH/2+IH/2*f);
            c.stroke();
          }
          c.strokeStyle='rgba(120,96,58,.9)';c.lineWidth=1;
          c.beginPath();
          c.moveTo(sx-IW/2,sy+IH/2);c.lineTo(sx,sy+IH);
          c.moveTo(sx,sy);c.lineTo(sx+IW/2,sy+IH/2);
          c.stroke();
          // korkuluk direkleri
          c.strokeStyle='#4a3620';c.lineWidth=2;
          c.beginPath();c.moveTo(sx-IW/2,sy+IH/2);c.lineTo(sx-IW/2,sy+IH/2-6);c.stroke();
          c.beginPath();c.moveTo(sx+IW/2,sy+IH/2);c.lineTo(sx+IW/2,sy+IH/2-6);c.stroke();
        }
        continue;
      }
      // çimen: ton varyasyonu
      c.fillStyle=grass[terrain[i]];
      diamondPath(c,sx,sy);c.fill();
      // ince detaylar: ot öbekleri / çiçek / çakıl
      const h=hash2(tx*3+1,ty*7+2);
      if(h<0.14){
        c.strokeStyle='rgba(110,140,70,.8)';c.lineWidth=1;
        const gx=sx+(h*80-6), gy=sy+IH/2+ (hash2(tx,ty)*8-4);
        c.beginPath();c.moveTo(gx,gy);c.lineTo(gx-2,gy-4);c.moveTo(gx,gy);c.lineTo(gx+1,gy-5);c.moveTo(gx,gy);c.lineTo(gx+3,gy-3);c.stroke();
      }else if(h<0.17){
        c.fillStyle=hash2(ty,tx)<0.5?'#c9c05a':'#c07a8a';
        const gx=sx+(hash2(tx+9,ty)*24-12), gy=sy+IH/2+(hash2(tx,ty+9)*10-5);
        c.fillRect(gx,gy,2,2);
      }else if(h>0.96){
        c.fillStyle='#6b6e63';
        const gx=sx+(hash2(tx+5,ty)*20-10), gy=sy+IH/2+(hash2(tx,ty+5)*8-4);
        c.beginPath();c.arc(gx,gy,2.5,0,7);c.fill();
      }
    }
  }
  // ---- GENİŞ ZEMİN LEKELERİ: alçak frekanslı doğal doku ----
  for(let gy=1;gy<MH-1;gy+=3)for(let gx=1;gx<MW-1;gx+=3){
    const h=hash2(gx*17+5,gy*23+9);
    if(h<0.4)continue;
    const i=gy*MW+gx;
    if(water[i]||(ridge&&ridge[i]))continue;
    const [ix,iy]=tileIso(gx,gy);
    const cx2=ix+ISO_X0+(hash2(gx,gy*3)*60-30);
    const cy2=iy+ISO_Y0+IH/2+(hash2(gy,gx*3)*30-15);
    const R=26+h*46;
    const g2=c.createRadialGradient?c.createRadialGradient(cx2,cy2,4,cx2,cy2,R):null;
    let col;
    if(LEVEL>=3) col=h<0.6?'rgba(178,196,210,':(h<0.8?'rgba(240,246,252,':'rgba(150,168,184,');
    else col=h<0.6?'rgba(46,62,28,':(h<0.8?'rgba(120,100,58,':'rgba(96,116,56,');
    const al=0.05+h*0.07;
    if(g2&&g2.addColorStop){
      g2.addColorStop(0,col+al+')');
      g2.addColorStop(1,col+'0)');
      c.fillStyle=g2;
    }else c.fillStyle=col+al+')';
    c.beginPath();c.ellipse(cx2,cy2,R,R*0.5,0,0,7);c.fill();
    // seyrek krater / kaya çıkartması
    if(h>0.965){
      c.strokeStyle=LEVEL>=3?'rgba(120,140,158,.4)':'rgba(50,44,30,.4)';
      c.lineWidth=2;
      c.beginPath();c.ellipse(cx2,cy2,9,4,0,0,7);c.stroke();
      c.fillStyle=LEVEL>=3?'rgba(90,108,124,.3)':'rgba(40,36,24,.3)';
      c.beginPath();c.ellipse(cx2,cy2,6,2.6,0,0,7);c.fill();
    }
  }
  // ---- KUM KATMANI: sis tekniğiyle yumuşak geçiş ----
  // Düşük çözünürlüklü kum-yoğunluk haritası, izometrik dönüşümle
  // bilinear büyütülür: çimene de suya da gradyanla erir (sis gibi).
  if(sandCvs){
    c.save();
    c.imageSmoothingEnabled=true;
    c.transform(TILE/SAND_R, IH/(2*SAND_R), -TILE/SAND_R, IH/(2*SAND_R), ISO_X0, ISO_Y0);
    c.drawImage(sandCvs,0,0);
    c.restore();
  }
  // kum dokusu: benek + kabuk (çekirdek kum karoları üstüne)
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    if(!sandMask[ty*MW+tx])continue;
    const [ix,iy]=tileIso(tx,ty);
    const sx=ix+ISO_X0, sy=iy+ISO_Y0;
    for(let k2=0;k2<4;k2++){
      const h3=hash2(tx*9+k2,ty*5+k2);
      c.fillStyle=h3<0.5?'rgba(150,134,96,.45)':'rgba(226,213,170,.5)';
      c.beginPath();
      c.arc(sx+(hash2(tx+k2,ty*2)*40-20), sy+IH/2+(hash2(ty+k2,tx*2)*14-7), 1+h3*1.3, 0, 7);
      c.fill();
    }
    if(hash2(tx*13,ty*17)>0.94){
      c.fillStyle='#e8ddc0';
      c.beginPath();c.arc(sx+(hash2(tx,ty*3)*22-11),sy+IH/2,1.7,0,7);c.fill();
    }
  }
}
// ---- su parıltısı (dinamik, görünür karolar) ----
function drawWaterShimmer(x0,x1,y0,y1){
  if(LEVEL>=3)return;
  ctx.fillStyle='rgba(180,220,235,.25)';
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const i=ty*MW+tx;
    if(!water[i]||bridge[i])continue;
    const ph=Math.sin(simTime*2+tx*1.7+ty*2.3);
    if(ph>0.55){
      const [ix,iy]=tileIso(tx,ty);
      const sx=ix-cam.x, sy=iy-cam.y;
      ctx.beginPath();
      ctx.ellipse(sx+(ph*10-5), sy+IH/2+ (ph*4-2), 7,2, 0,0,7);
      ctx.fill();
    }
  }
}
// ---- ekran açısı: dünya açısını izoya çevir ----
function isoAng(a){
  return Math.atan2((Math.cos(a)+Math.sin(a))*0.5, Math.cos(a)-Math.sin(a));
}
// ---- ağaç ----
function drawTree(tx,ty){
  const seed=treeSeed[ty*MW+tx];
  const wx=tx*TILE+16+ (seed*10-5), wy=ty*TILE+16+ (seed*8-4);
  const sx=isoX(wx,wy)-cam.x, sy=isoY(wx,wy)-cam.y;
  const s=0.85+seed*0.5;
  const sway=Math.sin(simTime*1.2+seed*20)*1.2;
  // gölge
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(sx,sy+2,11*s,4.5*s,0,0,7);ctx.fill();
  // gövde
  ctx.fillStyle='#5a4226';
  ctx.fillRect(sx-1.6*s,sy-13*s,3.2*s,14*s);
  // taç: üç katman
  const g1=seed<0.5?'#2f4a24':'#35531f';
  ctx.fillStyle=g1;
  ctx.beginPath();ctx.ellipse(sx+sway*0.4,sy-15*s,10*s,8*s,0,0,7);ctx.fill();
  ctx.fillStyle='#3d6128';
  ctx.beginPath();ctx.ellipse(sx+sway*0.7,sy-21*s,8*s,6.5*s,0,0,7);ctx.fill();
  ctx.fillStyle='#4c7433';
  ctx.beginPath();ctx.ellipse(sx+sway,sy-26*s,5.5*s,4.5*s,0,0,7);ctx.fill();
  if(LEVEL>=3){ // kar başlıkları
    ctx.fillStyle='rgba(238,244,248,.9)';
    ctx.beginPath();ctx.ellipse(sx+sway,sy-27*s,4.6*s,2.4*s,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(sx+sway*0.7-2*s,sy-21*s,4*s,2*s,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(sx+3*s,sy-14*s,4.5*s,2*s,0,0,7);ctx.fill();
  }else{
    ctx.fillStyle='rgba(190,220,140,.35)';
    ctx.beginPath();ctx.ellipse(sx+3*s+sway,sy-27*s,2.5*s,2*s,0,0,7);ctx.fill();
  }
}
// ---- sarp kaya sırtı ----
function drawRidge(tx,ty){
  const h=hash2(tx*7,ty*3);
  const wx=tx*TILE+16, wy=ty*TILE+16;
  const sx=isoX(wx,wy)-cam.x, sy=isoY(wx,wy)-cam.y;
  const hh=16+h*10;
  ctx.fillStyle='#3a4048';
  ctx.beginPath();
  ctx.moveTo(sx-16,sy+6);
  ctx.lineTo(sx-8+h*4,sy-hh);
  ctx.lineTo(sx+4,sy-hh*0.7);
  ctx.lineTo(sx+16,sy+6);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#4c545e';
  ctx.beginPath();
  ctx.moveTo(sx-8+h*4,sy-hh);
  ctx.lineTo(sx+4,sy-hh*0.7);
  ctx.lineTo(sx+16,sy+6);
  ctx.lineTo(sx+2,sy+4);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(240,246,250,.92)'; // kar tepesi
  ctx.beginPath();
  ctx.ellipse(sx-4+h*4,sy-hh+2,7,3,0,0,7);ctx.fill();
}
// ---- cevher ----
function drawOre(tx,ty){
  const amt=ore[ty*MW+tx];
  const [ix,iy]=tileIso(tx,ty);
  const sx=ix-cam.x, sy=iy-cam.y+IH/2;
  const n=amt>550?4:(amt>250?3:2);
  for(let i=0;i<n;i++){
    const h=hash2(tx*5+i,ty*3+i);
    const ox=(h*36-18), oy=(hash2(ty+i,tx)*14-7);
    const s=(3+h*4)*(0.6+0.6*Math.min(1,amt/800));
    ctx.fillStyle='#c9a02f';
    ctx.beginPath();
    ctx.moveTo(sx+ox,sy+oy-s*1.6);
    ctx.lineTo(sx+ox+s,sy+oy);
    ctx.lineTo(sx+ox,sy+oy+s*0.5);
    ctx.lineTo(sx+ox-s,sy+oy);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#f0d878';
    ctx.beginPath();
    ctx.moveTo(sx+ox,sy+oy-s*1.6);
    ctx.lineTo(sx+ox+s*0.5,sy+oy-s*0.5);
    ctx.lineTo(sx+ox,sy+oy-s*0.2);
    ctx.closePath();ctx.fill();
  }
}
// ---- can barı ----
function drawHPScreen(sx,sy,w,ratio){
  ctx.fillStyle='rgba(10,10,10,.8)';ctx.fillRect(sx-w/2,sy,w,4);
  ctx.fillStyle=ratio>0.5?'#5fae4a':(ratio>0.25?'#d9b13b':'#d8442f');
  ctx.fillRect(sx-w/2,sy,w*ratio,4);
}
// ---- birim ----
function drawUnit(u){
  const sx=isoX(u.x,u.y)-cam.x, sy=isoY(u.x,u.y)-cam.y;
  const a=isoAng(u.angle);
  // KADEME A/B: pişmiş veya 3D sprite varsa doğrudan bas
  const spr=SPR[u.key+'_'+u.team]||((u.key==='heli')?EXT_SPR['heli_'+u.team]:null);
  if(spr&&u.key==='heli'){
    // 3D heli: gölge yerde, gövde havada, pervaneler canlı
    const alt=26;
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath();ctx.ellipse(sx,sy+3,11,4.5,0,0,7);ctx.fill();
    const hy=sy-alt+Math.sin(simTime*3+u.anim)*1.5;
    const k=((Math.round(u.angle/(Math.PI*2/16))+(spr.off||0))%16+16)%16;
    const half=spr.fwL/2;
    ctx.drawImage(spr.img||spr.cvs, k*spr.fw,0,spr.fw,spr.fw, sx-half, hy-half, spr.fwL, spr.fwL);
    ctx.save();ctx.translate(sx,hy-6);
    ctx.rotate(simTime*22+u.anim);
    ctx.strokeStyle='rgba(30,30,25,.75)';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(16,0);ctx.moveTo(0,-6.5);ctx.lineTo(0,6.5);ctx.stroke();
    ctx.restore();
    if(u.muzzle>0){
      ctx.fillStyle='#ffe08a';
      ctx.beginPath();ctx.arc(sx+Math.cos(a)*12,hy+Math.sin(a)*6,3.4,0,7);ctx.fill();
    }
    if(selected.includes(u)){
      ctx.strokeStyle='#7ef07e';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(sx,sy+1,u.size+7,(u.size+7)*0.5,0,0,7);ctx.stroke();
    }
    if(u.hp<u.maxHp)drawHPScreen(sx,hy-half+4,24,u.hp/u.maxHp);
    if(u.flash>0)u.flash-=0.016;
    return;
  }
  if(spr){
    const moving2=(u.state==='moving'||u.state==='toOre'||u.state==='toRef'||(u.state==='attacking'&&u.path));
    if(u.key==='boat'&&moving2){ // canlı dümen suyu
      ctx.fillStyle='rgba(225,240,248,.35)';
      ctx.beginPath();
      ctx.ellipse(sx-Math.cos(a)*14,sy+2-Math.sin(a)*7,11,3.8,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(225,240,248,.18)';
      ctx.beginPath();
      ctx.ellipse(sx-Math.cos(a)*24,sy+3-Math.sin(a)*11,14,4.6,0,0,7);ctx.fill();
    }
    const k=((Math.round(u.angle/(Math.PI*2/16))+(spr.off||0))%16+16)%16;
    const half=spr.fwL/2;
    ctx.drawImage(spr.img||spr.cvs, k*spr.fw,0,spr.fw,spr.fw, sx-half, sy-half, spr.fwL, spr.fwL);
    if(u.flash>0){ // isabet parlaması
      ctx.fillStyle='rgba(255,255,255,'+Math.min(0.7,u.flash*4)+')';
      ctx.beginPath();ctx.ellipse(sx,sy-2,spr.fwL*0.24,spr.fwL*0.13,0,0,7);ctx.fill();
    }
    if(u.key==='harv'&&u.load>0){ // canlı altın yük
      const f=Math.min(1,u.load/HARV_CAP);
      ctx.fillStyle='#d9b13b';
      ctx.beginPath();ctx.ellipse(sx-Math.cos(a)*3,sy-5-Math.sin(a)*1.5,7*f+2,3.4*f+1,0,0,7);ctx.fill();
      ctx.fillStyle='#f0d878';
      ctx.beginPath();ctx.ellipse(sx-Math.cos(a)*3-1,sy-6-Math.sin(a)*1.5,2.4*f+0.6,1.3*f+0.4,0,0,7);ctx.fill();
    }
    if(u.muzzle>0&&u.dmg>0){ // canlı namlu alevi (pişmiş uç ofsetiyle)
      const tip=spr.tips[k];
      ctx.fillStyle='rgba(255,220,140,.45)';
      ctx.beginPath();ctx.arc(sx+tip[0],sy+tip[1]-4,6.5,0,7);ctx.fill();
      ctx.fillStyle='#ffe08a';
      ctx.beginPath();ctx.arc(sx+tip[0],sy+tip[1]-4,3.6,0,7);ctx.fill();
      ctx.fillStyle='#fff6d0';
      ctx.beginPath();ctx.arc(sx+tip[0],sy+tip[1]-4,1.7,0,7);ctx.fill();
    }
    if(selected.includes(u)){
      ctx.strokeStyle='#7ef07e';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(sx,sy+1,u.size+7,(u.size+7)*0.5,0,0,7);ctx.stroke();
    }
    if(u.hp<u.maxHp)drawHPScreen(sx,sy-26,24,u.hp/u.maxHp);
    if(u.flash>0)u.flash-=0.016;
    return;
  }
  const moving=(u.state==='moving'||u.state==='toOre'||u.state==='toRef'||(u.state==='attacking'&&u.path));
  const c =u.flash>0?'#fff':TEAM_COLOR[u.team];
  const cl=u.flash>0?'#fff':TEAM_LIGHT[u.team];
  const cd=TEAM_DARK[u.team];
  if(u.key==='rifle'||u.key==='rocket'||u.key==='medic'){
    const rocket=u.key==='rocket';
    const medic=u.key==='medic';
    const dirx=Math.cos(a), diry=Math.sin(a)*0.55;
    const ph=u.anim*2;
    const swing=moving?Math.sin(ph):0;
    // yürürken zıplama, dururken nefes
    const bob=moving?Math.abs(Math.cos(ph))*1.1:Math.sin(simTime*1.8+u.id)*0.35;
    const rec=(u.muzzle>0?1.5:0);          // geri tepme
    const bx=sx-dirx*rec*0.7, by=sy-bob;
    // gölge
    ctx.fillStyle='rgba(0,0,0,.32)';
    ctx.beginPath();ctx.ellipse(sx,sy+0.5,6.5,2.8,0,0,7);ctx.fill();
    // ---- BACAKLAR: kalça→diz→ayak eklemli yürüyüş ----
    const hipY=by-7;
    for(const side of [-1,1]){
      const sw=swing*side;
      const hipX=bx+side*1.7;
      const footX=bx+side*1.7+dirx*sw*3.6;
      const footY=sy-(sw>0?Math.abs(sw)*1.8:0);   // öndeki ayak havada
      const kneeX=(hipX+footX)/2+dirx*1.2;
      const kneeY=(hipY+footY)/2-1.3;
      ctx.strokeStyle='#2e3129';ctx.lineWidth=2.1;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(hipX,hipY);
      ctx.quadraticCurveTo(kneeX,kneeY,footX,footY);ctx.stroke();
      ctx.fillStyle='#17190f';                     // bot
      ctx.fillRect(footX-1.4+dirx*0.9,footY-1.4,3,2);
    }
    ctx.lineCap='butt';
    // ---- GÖVDE: geniş omuzlu trapez + teçhizat ----
    const uni=u.flash>0?'#fff':(medic?'#9aa08c':shade(TEAM_DARK[u.team],rocket?14:26));
    ctx.fillStyle=uni;
    ctx.beginPath();
    ctx.moveTo(bx-3.5,by-13.6);ctx.lineTo(bx+3.5,by-13.6);
    ctx.lineTo(bx+2.4,by-6.8);ctx.lineTo(bx-2.4,by-6.8);
    ctx.closePath();ctx.fill();
    // sırt çantası (bakış yönünün tersinde)
    if(medic){
      ctx.fillStyle='#e8e6dd';
      ctx.fillRect(bx-dirx*3.4-1.8,by-12.8-diry*3.4,3.6,4.4);
      ctx.fillStyle='#c8302e';
      ctx.fillRect(bx-dirx*3.4-0.6,by-11.9-diry*3.4,1.2,2.6);
      ctx.fillRect(bx-dirx*3.4-1.3,by-11.2-diry*3.4,2.6,1.2);
    }else{
      ctx.fillStyle=shade(TEAM_DARK[u.team],-8);
      ctx.fillRect(bx-dirx*3.4-1.6,by-12.6-diry*3.4,3.2,4.2);
    }
    if(rocket){ // sırtta yedek roket rafı
      ctx.fillStyle='#3d4436';
      ctx.fillRect(bx-dirx*3.6-2,by-13.4-diry*3.6,4,1.6);
      ctx.fillStyle='#c85030';
      ctx.fillRect(bx-dirx*3.6-2,by-13.4-diry*3.6,1.2,1.6);
      ctx.fillRect(bx-dirx*3.6+0.8,by-13.4-diry*3.6,1.2,1.6);
    }
    // taktik yelek + kemer + takım omuz bantları
    ctx.fillStyle='rgba(18,20,15,.55)';
    ctx.fillRect(bx-2.5,by-12.7,5,3.8);
    ctx.fillStyle='rgba(255,255,255,.08)';
    ctx.fillRect(bx-2.5,by-12.7,5,1);
    ctx.fillStyle='#12140e';ctx.fillRect(bx-2.5,by-8.1,5,1.1);
    ctx.fillStyle=u.flash>0?'#fff':TEAM_COLOR[u.team];
    ctx.fillRect(bx-3.5,by-13.6,1.7,2.1);
    ctx.fillRect(bx+1.8,by-13.6,1.7,2.1);
    // ---- BAŞ: modern kask (kubbe + ense koruması + vizör bandı) ----
    const hy=by-15.4;
    ctx.fillStyle='#c8a882';
    ctx.beginPath();ctx.arc(bx,hy,2.5,0,7);ctx.fill();
    ctx.fillStyle=medic?'#e8e6dd':(rocket?'#20231c':shade(TEAM_DARK[u.team],4));
    ctx.beginPath();ctx.arc(bx,hy-0.6,2.9,Math.PI*0.92,Math.PI*2.08);ctx.fill();
    ctx.fillRect(bx-2.9,hy-0.9,5.8,1.5);
    ctx.fillRect(bx-dirx*2.6-0.8,hy+0.4,1.6,1.6);      // ense koruması (arkada)
    if(medic){                                          // kaskta kızıl haç
      ctx.fillStyle='#c8302e';
      ctx.fillRect(bx-0.6,hy-2.6,1.2,2.6);
      ctx.fillRect(bx-1.4,hy-1.9,2.8,1.2);
    }else{
      ctx.fillStyle=rocket?'#d9b13b':'#0f110c';         // vizör / gözlük bandı
      ctx.fillRect(bx-2.2,hy-0.1,4.4,1);
    }
    if(medic){
      // ---- SIHHİYE ÇANTASI + İYİLEŞTİRME POZU ----
      ctx.fillStyle='#e8e6dd';                          // yan çanta
      ctx.fillRect(bx+2.2,by-9.4,3,2.4);
      ctx.fillStyle='#c8302e';
      ctx.fillRect(bx+3.3,by-9.1,0.9,1.8);
      ctx.fillRect(bx+2.85,by-8.65,1.8,0.9);
      ctx.strokeStyle=uni;ctx.lineWidth=1.6;
      if(u.healing){                                    // kollar yaralıya uzanır
        ctx.beginPath();ctx.moveTo(bx+1.8,by-12.6);ctx.lineTo(bx+dirx*6,by-9.5+diry*6);ctx.stroke();
        ctx.beginPath();ctx.moveTo(bx-1.8,by-12.6);ctx.lineTo(bx+dirx*5,by-8.8+diry*5);ctx.stroke();
        ctx.fillStyle='#c8a882';
        ctx.beginPath();ctx.arc(bx+dirx*6,by-9.5+diry*6,1,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(bx+dirx*5,by-8.8+diry*5,1,0,7);ctx.fill();
        if(Math.sin(simTime*6)>0){                      // el feneri gibi yeşil şifa ışığı
          ctx.fillStyle='rgba(126,240,126,.5)';
          ctx.beginPath();ctx.arc(bx+dirx*7,by-9+diry*7,2.6,0,7);ctx.fill();
        }
      }else{                                            // kollar yanda
        ctx.beginPath();ctx.moveTo(bx+2.2,by-12.6);ctx.lineTo(bx+2.6,by-8.6);ctx.stroke();
        ctx.beginPath();ctx.moveTo(bx-2.2,by-12.6);ctx.lineTo(bx-2.6,by-8.6);ctx.stroke();
      }
      // kol bandı: beyaz + haç
      ctx.fillStyle='#e8e6dd';ctx.fillRect(bx-3.1,by-12.2,1.4,1.6);
      ctx.fillStyle='#c8302e';ctx.fillRect(bx-2.75,by-11.8,0.7,0.8);
    }else if(rocket){
      // ---- OMUZ ROKETATARI ----
      const ty2=by-13.6;
      ctx.strokeStyle='#3d4436';ctx.lineWidth=4.4;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(bx-dirx*(4.5),ty2-diry*4.5);
      ctx.lineTo(bx+dirx*(9.5-rec),ty2+diry*(9.5-rec));
      ctx.stroke();ctx.lineCap='butt';
      ctx.fillStyle='#15150f';                          // tüp ağzı
      ctx.beginPath();ctx.arc(bx+dirx*(9.5-rec),ty2+diry*(9.5-rec),2.5,0,7);ctx.fill();
      ctx.fillStyle='#d9b13b';                          // uyarı bandı
      ctx.fillRect(bx+dirx*4-1.4,ty2+diry*4-2.4,2.8,4.8);
      ctx.fillStyle='#c85030';                          // yüklü roket ucu
      ctx.beginPath();ctx.arc(bx+dirx*(11-rec),ty2+diry*(11-rec),1.6,0,7);ctx.fill();
      // kollar tüpü kavrar
      ctx.strokeStyle=uni;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(bx+1.8,by-12.5);ctx.lineTo(bx+dirx*5,ty2+diry*5+2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx-1.8,by-12.5);ctx.lineTo(bx+dirx*1.5,ty2+diry*1.5+2.4);ctx.stroke();
      ctx.fillStyle='#c8a882';
      ctx.beginPath();ctx.arc(bx+dirx*5,ty2+diry*5+2,1,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(bx+dirx*1.5,ty2+diry*1.5+2.4,1,0,7);ctx.fill();
      if(u.muzzle>0){
        ctx.fillStyle='#ffd070';
        ctx.beginPath();ctx.arc(bx+dirx*13.5,ty2+diry*13.5,3.6,0,7);ctx.fill();
        ctx.fillStyle='rgba(200,200,190,.6)';           // geri tepme dumanı
        ctx.beginPath();ctx.arc(bx-dirx*7.5,ty2-diry*7.5,3,0,7);ctx.fill();
      }
    }else{
      // ---- PİYADE TÜFEĞİ: dipçik + gövde + şarjör, iki elle ----
      const gy=by-10.8;
      const tipx=bx+dirx*(8.5-rec), tipy=gy+diry*(8.5-rec);
      ctx.strokeStyle='#12140e';ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(bx-dirx*3.6,gy-diry*3.6+0.9);          // dipçik omuzda
      ctx.lineTo(tipx,tipy);ctx.stroke();
      ctx.fillStyle='#2c2f26';                          // şarjör
      ctx.fillRect(bx+dirx*2.4-0.9,gy+diry*2.4+0.7,1.8,2.5);
      // kollar: arka el kabzada, ön el kundakta
      ctx.strokeStyle=uni;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(bx+1.8,by-12.6);ctx.lineTo(bx+dirx*5,gy+diry*5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx-1.8,by-12.6);ctx.lineTo(bx+dirx*1,gy+diry*1+0.6);ctx.stroke();
      ctx.fillStyle='#c8a882';
      ctx.beginPath();ctx.arc(bx+dirx*5,gy+diry*5,0.95,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(bx+dirx*1,gy+diry*1+0.6,0.95,0,7);ctx.fill();
      if(u.muzzle>0){                                    // yıldız namlu alevi
        ctx.strokeStyle='#ffe08a';ctx.lineWidth=1.2;
        for(let k2=0;k2<4;k2++){
          const fa=a+k2*Math.PI/2+0.4;
          ctx.beginPath();ctx.moveTo(tipx,tipy);
          ctx.lineTo(tipx+Math.cos(fa)*3.4,tipy+Math.sin(fa)*2);ctx.stroke();
        }
        ctx.fillStyle='#fff3c0';
        ctx.beginPath();ctx.arc(tipx+dirx*1.2,tipy+diry*1.2,1.5,0,7);ctx.fill();
      }
    }
  }else if(u.key==='arty'){
    // roket topçusu: kamyon + sırtta roket rampası
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(sx,sy+1,14,6,0,0,7);ctx.fill();
    ctx.save();ctx.translate(sx,sy);
    ctx.transform(1,0,0,0.55,0,0);ctx.rotate(a);
    ctx.fillStyle='#242420';
    ctx.fillRect(-12,-11,6,22); ctx.fillRect(7,-11,6,22);
    ctx.fillStyle=cd;ctx.fillRect(-10,-9,20,18);
    ctx.fillStyle=c;ctx.fillRect(-10,-9,20,7);
    // rampa: eğik roket kutusu
    ctx.fillStyle='#3d4436';
    ctx.fillRect(-8,-6,14,12);
    ctx.fillStyle='#d9b13b';
    for(let r2=0;r2<3;r2++)ctx.fillRect(-6+r2*4,-4,2.5,8);
    if(u.muzzle>0){
      ctx.fillStyle='#ffd070';
      ctx.beginPath();ctx.arc(10,0,5,0,7);ctx.fill();
    }
    ctx.restore();
  }else if(u.key==='boat'){
    // devriye botu: su izi + gövde + küçük top
    ctx.fillStyle='rgba(220,240,250,.35)';
    ctx.beginPath();ctx.ellipse(sx-Math.cos(a)*10,sy+2-Math.sin(a)*5,10,3.5,0,0,7);ctx.fill();
    ctx.save();ctx.translate(sx,sy);
    ctx.transform(1,0,0,0.55,0,0);ctx.rotate(a);
    ctx.fillStyle='#2c3340';
    ctx.beginPath();
    ctx.moveTo(16,0);ctx.lineTo(6,-7);ctx.lineTo(-13,-7);ctx.lineTo(-13,7);ctx.lineTo(6,7);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.moveTo(13,0);ctx.lineTo(5,-5);ctx.lineTo(-11,-5);ctx.lineTo(-11,5);ctx.lineTo(5,5);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#d5d8c8';ctx.fillRect(-8,-3,7,6); // kabin
    ctx.fillStyle='#1e1e18';ctx.fillRect(2,-1.6,12,3.2); // top
    if(u.muzzle>0){ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(16,0,3.4,0,7);ctx.fill();}
    ctx.restore();
  }else if(u.key==='heli'){
    // helikopter: yerde gölge, havada gövde + dönen pervane
    const alt=22; // uçuş yüksekliği
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath();ctx.ellipse(sx,sy+3,11,4.5,0,0,7);ctx.fill();
    const hy=sy-alt+Math.sin(simTime*3+u.anim)*1.5;
    ctx.save();ctx.translate(sx,hy);
    ctx.transform(1,0,0,0.62,0,0);ctx.rotate(a);
    // kuyruk
    ctx.fillStyle=cd;ctx.fillRect(-18,-1.8,12,3.6);
    ctx.fillStyle=c;
    ctx.beginPath();ctx.ellipse(0,0,10,6,0,0,7);ctx.fill(); // gövde
    ctx.fillStyle='#cfe6ef';
    ctx.beginPath();ctx.ellipse(5,0,4,3.4,0,0,7);ctx.fill(); // kokpit camı
    ctx.fillStyle='#1e1e18';ctx.fillRect(2,-7,7,2.2);ctx.fillRect(2,4.8,7,2.2); // roket podları
    if(u.muzzle>0){ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(12,0,3.2,0,7);ctx.fill();}
    ctx.restore();
    // ana pervane (hızlı dönüş)
    ctx.save();ctx.translate(sx,hy-4);
    ctx.rotate(simTime*22+u.anim);
    ctx.strokeStyle='rgba(30,30,25,.75)';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(15,0);ctx.moveTo(0,-6);ctx.lineTo(0,6);ctx.stroke();
    ctx.restore();
    // kuyruk rotoru
    ctx.save();
    ctx.translate(sx-16*Math.cos(a), hy-16*Math.sin(a)*0.62);
    ctx.rotate(simTime*30);
    ctx.strokeStyle='rgba(30,30,25,.7)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(4,0);ctx.stroke();
    ctx.restore();
  }else if(u.key==='sdrone'||u.key==='hdrone'||u.key==='rdrone'||u.key==='tdrone'){
    // QUADCOPTER AİLESİ
    const alt=u.key==='sdrone'?20:26;
    const sc=u.key==='sdrone'?0.72:(u.key==='hdrone'?0.95:1);
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.beginPath();ctx.ellipse(sx,sy+2,8*sc,3.2*sc,0,0,7);ctx.fill();
    const hy=sy-alt+Math.sin(simTime*4+u.anim)*1.4;
    const bodyC=u.team===PLAYER?(u.key==='rdrone'?'#c9ced4':c):(u.key==='hdrone'?'#3c4652':'#2c2f28');
    ctx.save();ctx.translate(sx,hy);
    ctx.transform(1,0,0,0.62,0,0);ctx.rotate(a);
    // X çerçeve kolları
    ctx.strokeStyle='#1c1e18';ctx.lineWidth=2.2*sc;
    ctx.beginPath();
    ctx.moveTo(-8*sc,-8*sc);ctx.lineTo(8*sc,8*sc);
    ctx.moveTo(-8*sc,8*sc);ctx.lineTo(8*sc,-8*sc);
    ctx.stroke();
    // gövde
    ctx.fillStyle=bodyC;
    ctx.beginPath();ctx.ellipse(0,0,6*sc,4.4*sc,0,0,7);ctx.fill();
    if(u.key==='tdrone'){ // füze podları
      ctx.fillStyle='#1e1e18';
      ctx.fillRect(-2*sc,-7.5*sc,7*sc,2.4*sc);

      ctx.fillStyle='#c85030';

    }
    if(u.key==='rdrone'){ // kamera kubbesi
      ctx.fillStyle='#28303a';
      ctx.beginPath();ctx.arc(3*sc,0,2.4*sc,0,7);ctx.fill();
      if(Math.sin(simTime*5+u.id)>0.3){
        ctx.fillStyle='#7ec8f0';
        ctx.beginPath();ctx.arc(3.6*sc,0,1*sc,0,7);ctx.fill();
      }
    }
    if(u.muzzle>0){ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(9*sc,0,3*sc,0,7);ctx.fill();}
    ctx.restore();
    // 4 pervane bulanıklığı
    for(const [ox,oy] of [[-8,-5],[8,-5],[-8,5],[8,5]]){
      ctx.save();
      ctx.translate(sx+ox*sc,hy+oy*sc);
      ctx.rotate(simTime*26+u.id+ox);
      ctx.strokeStyle='rgba(40,42,36,.7)';ctx.lineWidth=1.2;

    // LED: sürü kırmızı göz / avcı camgöbeği
    const led=u.key==='sdrone'?'#ff3828':(u.key==='hdrone'?'#40d0e8':(u.team===PLAYER?'#7ef07e':'#ff3828'));
    if(Math.sin(simTime*7+u.id*2)>-0.2){
      ctx.fillStyle=led;
      ctx.beginPath();ctx.arc(sx,hy-2,1.6*sc,0,7);ctx.fill();
    }
  }else if(u.key==='harv'){
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(sx,sy+1,15,6,0,0,7);ctx.fill();
    ctx.save();ctx.translate(sx,sy);
    ctx.transform(1,0,0,0.55,0,0); // izometrik basıklık
    ctx.rotate(a);
    // tekerlekler
    ctx.fillStyle='#242420';
    ctx.fillRect(-13,-12,7,24); ctx.fillRect(7,-12,7,24);
    // kasa
    ctx.fillStyle='#a06a28';ctx.fillRect(-11,-10,22,20);
    ctx.fillStyle='#c07a2c';ctx.fillRect(-11,-10,22,9);
    // kabin (ön)
    ctx.fillStyle=c;ctx.fillRect(4,-9,7,18);
    ctx.fillStyle='#cfe6ef';ctx.fillRect(8,-6,2.5,12);
    // yük
    if(u.load>0){
      ctx.fillStyle='#d9b13b';
      const f=Math.min(1,u.load/HARV_CAP);
      ctx.fillRect(-9,-7*f,10,14*f);
      ctx.fillStyle='#f0d878';ctx.fillRect(-7,-4*f,3,3);
    }
    ctx.restore();
  }else{ // tank / ağır tank — detaylı gövde
    const big=u.key==='heavy';
    const L=big?17:14, W2=big?11:9;
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(sx,sy+1,L+2,(W2+2)*0.6,0,0,7);ctx.fill();
    ctx.save();ctx.translate(sx,sy);
    ctx.transform(1,0,0,0.55,0,0);
    ctx.save();ctx.rotate(a);
    // paletler + yol tekerlekleri
    ctx.fillStyle='#1c1e18';
    ctx.fillRect(-L,-W2-3.5,L*2,6); ctx.fillRect(-L,W2-2.5,L*2,6);
    ctx.fillStyle='#34372e';
    for(let w=0;w<(big?5:4);w++){
      const wx2=-L+4+w*(L*2-8)/((big?5:4)-1);
      ctx.beginPath();ctx.arc(wx2,-W2-0.5,2.2,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(wx2,W2+0.5,2.2,0,7);ctx.fill();
    }
    // palet dişleri (hareket animasyonu)
    ctx.fillStyle='#454a3e';
    const off=(u.anim*6)%5;
    for(let p=-L+off;p<L;p+=5){
      ctx.fillRect(p,-W2-3.5,1.8,2); ctx.fillRect(p,-W2+0.5,1.8,2);
      ctx.fillRect(p,W2-2.5,1.8,2);  ctx.fillRect(p,W2+1.5,1.8,2);
    }
    // gövde: eğimli ön zırh (poligon)
    ctx.fillStyle=cd;
    ctx.beginPath();
    ctx.moveTo(L-1,0);              // ön uç sivri
    ctx.lineTo(L-6,-W2+1);
    ctx.lineTo(-L+2,-W2+1);
    ctx.lineTo(-L+2,W2-1);
    ctx.lineTo(L-6,W2-1);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.moveTo(L-3,0);
    ctx.lineTo(L-7,-W2+2.5);
    ctx.lineTo(-L+3,-W2+2.5);
    ctx.lineTo(-L+3,W2-2.5);
    ctx.lineTo(L-7,W2-2.5);
    ctx.closePath();ctx.fill();
    // üst yüz ışık bandı + panel çizgileri
    ctx.fillStyle=cl;
    ctx.fillRect(-L+3,-W2+2.5,L*2-10,3);
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(-L+6,-W2+2.5);ctx.lineTo(-L+6,W2-2.5);
    ctx.moveTo(0,-W2+2.5);ctx.lineTo(0,W2-2.5);ctx.stroke();
    // arka motor ızgarası + egzoz
    ctx.fillStyle='#2a2c24';
    for(let g2=0;g2<3;g2++)ctx.fillRect(-L+3.5,-3+g2*3,4,1.6);
    if(moving&&Math.random()<0.25){/* egzoz parçacığı draw dışında pahalı — atla */}
    // yedek palet / eşya (ağır tankta yan zırh etekleri)
    if(big){
      ctx.fillStyle='#3d4034';
      ctx.fillRect(-L+2,-W2-1,L*2-6,2);
      ctx.fillRect(-L+2,W2-1,L*2-6,2);
    }
    // ön farlar
    ctx.fillStyle='#f0e8b8';
    ctx.fillRect(L-7,-W2+3,1.6,2.4);ctx.fillRect(L-7,W2-5.4,1.6,2.4);
    ctx.restore();
    // taret: mantlet + namlu freni + kapak + anten
    ctx.rotate(a);
    ctx.fillStyle=cd;
    ctx.beginPath();ctx.ellipse(-1,0,big?9:7.5,big?7:5.8,0,0,7);ctx.fill();
    ctx.fillStyle=c;
    ctx.beginPath();ctx.ellipse(-1,0,big?7:5.8,big?5.4:4.4,0,0,7);ctx.fill();
    ctx.fillStyle=cl;
    ctx.beginPath();ctx.ellipse(-2,-1,big?4:3.2,big?2.6:2,0,0,7);ctx.fill();
    // mantlet (namlu kökü bloğu)
    ctx.fillStyle='#2a2c24';
    ctx.fillRect(big?4:3,big?-5:-3.4,4,big?10:6.8);
    // namlu(lar) + uçta fren
    ctx.fillStyle='#1e1e18';
    if(big){
      ctx.fillRect(6,-4.4,17,2.8); ctx.fillRect(6,1.6,17,2.8);
      ctx.fillStyle='#454a3e';
      ctx.fillRect(21,-5,4.5,3.9); ctx.fillRect(21,1.1,4.5,3.9);
    }else{
      ctx.fillRect(5,-1.7,16,3.4);
      ctx.fillStyle='#454a3e';
      ctx.fillRect(19,-2.4,4.5,4.8);
    }
    if(u.muzzle>0){
      ctx.fillStyle='#ffe08a';
      ctx.beginPath();ctx.arc(big?27:25,0,4.2,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,220,150,.4)';
      ctx.beginPath();ctx.arc(big?27:25,0,7,0,7);ctx.fill();
    }
    // komutan kapağı + anten
    ctx.fillStyle=cl;ctx.beginPath();ctx.arc(-3,big?-2:-1.5,2,0,7);ctx.fill();
    ctx.strokeStyle='#2a2c24';ctx.lineWidth=0.9;
    ctx.beginPath();ctx.moveTo(-5,2);
    ctx.quadraticCurveTo(-8,-4,-7+Math.sin(simTime*4+u.id)*1.2,-9);ctx.stroke();
    ctx.restore();
  }
  // seçim + can
  if(selected.includes(u)){
    ctx.strokeStyle='#7ef07e';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(sx,sy+1,u.size+7,(u.size+7)*0.5,0,0,7);ctx.stroke();
  }
  if(u.hp<u.maxHp)drawHPScreen(sx,sy-(u.key==='heli'?42:(u.key==='rifle'||u.key==='rocket'?23:22)),24,u.hp/u.maxHp);
}
// ---- bina (izometrik kutu) ----
// ========== KADEME A: SPRITE FIRINI ==========
// Araçlar açılışta 16 açıdan, 3x süper-örneklemeyle pişirilir.
// Pişirme anında gradyan/perçin/gölge/kenar ışığı serbest — oyun sadece basar.
const BAKE_S=3, BAKE_N=16;
let SPR={};
// ---- KADEME B: harici 3D-render sprite yükleyici ----
// kf_sprites/ klasöründe Blender dökümhanesinin PNG'leri varsa
// fırın sprite'larının yerine otomatik geçer; yoksa Kademe A devam eder.
const EXT_SPR={}; // key_team → {img,fw,fwL,off}
let extManifest=null, extCount=0, extNotified=false;
// Not: manifest fetch'i İSTEĞE BAĞLI — resimler <img> ile doğrudan yüklenir,
// bu yüzden file:// (çift tıklama) ile açılan oyunda bile çalışır.
const EXT_UNITS=['tank','heavy','harv','arty','boat','heli']; // piyade bilerek yok: canlı animasyonlu vektör daha iyi
function loadExternalSprites(){
  if(typeof Image==='undefined')return;
  let frame=288, logical=72, off=0;
  const startImgs=()=>{
    for(const unit of EXT_UNITS){
      for(let team=0;team<3;team++){
        const img=new Image();
        img.onload=()=>{
          // kare boyutunu resimden doğrula (16 kare yan yana)
          const fw=Math.round(img.width/16)||frame;
          EXT_SPR[unit+'_'+team]={img,fw,fwL:logical,off};
          if(SPR[unit+'_'+team])applyExt(unit,team);
          extCount++;
          console.log('🎬 3D sprite yüklendi:',unit,'takım',team,'('+fw+'px)');
          if(!extNotified&&typeof notify==='function'){
            extNotified=true;
            setTimeout(()=>notify('🎬 3D sprite paketi bulundu — araçlar Blender dökümüne geçiyor! ('+extCount+' şerit)'),600);
          }
        };
        img.onerror=()=>{};
        img.src='kf_sprites/'+unit+'_t'+team+'.png';
      }
    }
  };
  // manifest varsa kalibrasyon değerlerini al, yoksa varsayılanla devam
  if(typeof fetch!=='undefined'){
    fetch('kf_sprites/manifest.json').then(r=>r.ok?r.json():null).then(man=>{
      if(man){extManifest=man;frame=man.frame||288;logical=man.logical||72;off=man.angle_offset||0;}
      startImgs();
    }).catch(startImgs);
  }else startImgs();
}
function applyExt(unit,team){
  const e=EXT_SPR[unit+'_'+team];
  if(!e||!SPR[unit+'_'+team])return;
  const old=SPR[unit+'_'+team];
  SPR[unit+'_'+team]={img:e.img,fwL:e.fwL,fw:e.fw,tips:old.tips,off:e.off};
}
try{ loadExternalSprites(); }catch(e){}
function bakeAll(){
  SPR={};
  const types={tank:72,heavy:80,harv:74,arty:74,boat:84};
  for(let team=0;team<NTEAMS;team++)
    for(const key in types){
      SPR[key+'_'+team]=bakeVehicle(key,team,types[key]);
      if(EXT_SPR[key+'_'+team])applyExt(key,team); // 3D varsa üstüne bin
    }
}
function bakeVehicle(key,team,fwL){
  const fw=fwL*BAKE_S;
  const cv=document.createElement('canvas');
  cv.width=fw*BAKE_N; cv.height=fw;
  const c=cv.getContext('2d');
  const tips=[];
  for(let k=0;k<BAKE_N;k++){
    const a=k*Math.PI*2/BAKE_N;
    c.save();
    c.translate(k*fw+fw/2, fw/2);
    c.scale(BAKE_S,BAKE_S);
    try{ drawVehicleHD(c,key,team,a); }catch(e){}
    c.restore();
    // namlu ucu ekran ofseti (canlı alev için)
    const ia=isoAng(a);
    const d=key==='heavy'?27:(key==='tank'?25:(key==='boat'?17:(key==='arty'?11:0)));
    tips.push([Math.cos(ia)*d, Math.sin(ia)*d*0.55]);
  }
  return {cvs:cv,fwL,fw,tips};
}
function grd(c,x1,y1,x2,y2,stops){
  const g=c.createLinearGradient(x1,y1,x2,y2);
  if(g&&g.addColorStop)for(const [o,col] of stops)g.addColorStop(o,col);
  return g||stops[0][1];
}
function drawVehicleHD(c,key,team,a){
  const ia=isoAng(a);
  const C=TEAM_COLOR[team], CL=TEAM_LIGHT[team], CD=TEAM_DARK[team];
  // yumuşak pişmiş gölge
  const sh=c.createRadialGradient?c.createRadialGradient(1,4,2,1,4,22):null;
  if(sh&&sh.addColorStop){sh.addColorStop(0,'rgba(0,0,0,.4)');sh.addColorStop(1,'rgba(0,0,0,0)');}
  c.fillStyle=sh||'rgba(0,0,0,.3)';
  c.beginPath();c.ellipse(1,4,22,10,0,0,7);c.fill();

  if(key==='tank'||key==='heavy'){
    const big=key==='heavy';
    const L=big?17:14, W2=big?11:9;
    c.save();c.transform(1,0,0,0.55,0,0);c.save();c.rotate(ia);
    // paletler
    c.fillStyle='#16180f';
    c.fillRect(-L,-W2-3.8,L*2,6.4);c.fillRect(-L,W2-2.6,L*2,6.4);
    for(let w=0;w<(big?6:5);w++){
      const wx=-L+3.5+w*(L*2-7)/((big?6:5)-1);
      c.fillStyle='#2c3026';
      c.beginPath();c.arc(wx,-W2-0.6,2.4,0,7);c.fill();
      c.beginPath();c.arc(wx,W2+0.6,2.4,0,7);c.fill();
      c.fillStyle='#484d3e';
      c.beginPath();c.arc(wx,-W2-0.6,1,0,7);c.fill();
      c.beginPath();c.arc(wx,W2+0.6,1,0,7);c.fill();
    }
    c.fillStyle='#3d4234';
    for(let px=-L;px<L;px+=3.2){
      c.fillRect(px,-W2-3.8,1.6,2);c.fillRect(px,W2+2,1.6,2.2);
    }
    // eğimli gövde: gradyanlı zırh
    c.fillStyle=grd(c,0,-W2,0,W2,[[0,CL],[0.35,C],[1,shade(CD,6)]]);
    c.beginPath();
    c.moveTo(L-1,0);c.lineTo(L-6,-W2+1);c.lineTo(-L+2,-W2+1);
    c.lineTo(-L+2,W2-1);c.lineTo(L-6,W2-1);c.closePath();c.fill();
    c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=0.8;c.stroke();
    // kenar ışığı (üst hat)
    c.strokeStyle='rgba(255,250,225,.6)';c.lineWidth=1;
    c.beginPath();c.moveTo(L-2.5,-0.8);c.lineTo(L-6.5,-W2+1.6);c.lineTo(-L+3,-W2+1.6);c.stroke();
    // panel derzleri + perçinler
    c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=0.7;
    c.beginPath();c.moveTo(-L+7,-W2+1);c.lineTo(-L+7,W2-1);
    c.moveTo(1,-W2+1);c.lineTo(1,W2-1);c.stroke();

    // TARET: AO halkası + gradyan kubbe + mantlet + namlu

    c.beginPath();c.ellipse(-1,0.6,big?10:8.4,big?7.6:6.4,0,0,7);c.fill();

    c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=0.8;c.stroke();
    c.fillStyle='rgba(255,255,240,.4)';

    c.beginPath();

// ---- izometrik hacim yardımcıları ----
function P(wx,wy){return [isoX(wx,wy)-cam.x, isoY(wx,wy)-cam.y];}
function quadF(a,b2,c2,d2,fill){
  ctx.fillStyle=fill;
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b2[0],b2[1]);
  ctx.lineTo(c2[0],c2[1]);ctx.lineTo(d2[0],d2[1]);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=0.8;ctx.stroke();
}
// dünya dikdörtgeni (px) üzerinde h0→h1 prizma; win: sağ yüze ışıklı pencere
function boxW(x0,y0,x1,y1,h0,h1,cL,cR,cT,win,team,bid){
  const T=P(x0,y0),R=P(x1,y0),B=P(x1,y1),L=P(x0,y1);
  quadF([L[0],L[1]-h0],[B[0],B[1]-h0],[B[0],B[1]-h1],[L[0],L[1]-h1],cL);
  quadF([B[0],B[1]-h0],[R[0],R[1]-h0],[R[0],R[1]-h1],[B[0],B[1]-h1],cR);
  quadF([T[0],T[1]-h1],[R[0],R[1]-h1],[B[0],B[1]-h1],[L[0],L[1]-h1],cT);
  if(win){
    const lit=!lowPower(team), n=Math.max(2,Math.round((x1-x0)/TILE));
    for(let i=0;i<n;i++){
      const f=(i+0.5)/n;
      const wx=B[0]+(R[0]-B[0])*f, wy=B[1]+(R[1]-B[1])*f;
      ctx.fillStyle=lit?'rgba(255,214,130,'+(0.7+0.2*Math.sin(simTime*2+bid+i))+')':'#1c1e18';
      ctx.fillRect(wx-2,wy-h0-(h1-h0)*0.62,4,4.5);
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=0.6;
      ctx.strokeRect(wx-2,wy-h0-(h1-h0)*0.62,4,4.5);
    }
  }
}
// silindir (kule/silo/baca)
function cylW(wx,wy,r,h0,h1,cBody,cTop){
  const [sx,sy]=P(wx,wy);
  ctx.fillStyle=shade(cBody,-16);
  ctx.fillRect(sx-r,sy-h1,r*0.66,h1-h0);
  ctx.fillStyle=cBody;
  ctx.fillRect(sx-r+r*0.66,sy-h1,r*0.9,h1-h0);
  ctx.fillStyle=shade(cBody,14);
  ctx.fillRect(sx-r+r*1.56,sy-h1,r*0.44,h1-h0);
  ctx.beginPath();ctx.ellipse(sx,sy-h0,r,r*0.45,0,0,Math.PI);
  ctx.fillStyle=shade(cBody,-10);ctx.fill();
  ctx.fillStyle=cTop||shade(cBody,22);
  ctx.beginPath();ctx.ellipse(sx,sy-h1,r,r*0.45,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=0.8;ctx.stroke();
}
// kubbe (reaktör)
function domeW(wx,wy,r,h0,col){
  const [sx,sy]=P(wx,wy);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(sx,sy-h0,r,r*0.78,0,Math.PI,0);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.16)';
  ctx.beginPath();ctx.ellipse(sx+r*0.28,sy-h0-r*0.32,r*0.34,r*0.2,-0.5,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.14)';
  ctx.beginPath();ctx.ellipse(sx,sy-h0,r*0.62,r*0.48,0,Math.PI,0);ctx.stroke();
}
// beşik çatı (kışla): x ekseni boyunca mahya
function gableW(x0,y0,x1,y1,hWall,hRidge,cL,cR,rL,rR){
  const yM=(y0+y1)/2;
  const T=P(x0,y0),R=P(x1,y0),B=P(x1,y1),L=P(x0,y1);
  const G1=P(x0,yM),G2=P(x1,yM);
  quadF([L[0],L[1]],[B[0],B[1]],[B[0],B[1]-hWall],[L[0],L[1]-hWall],cL);
  quadF([B[0],B[1]],[R[0],R[1]],[R[0],R[1]-hWall],[B[0],B[1]-hWall],cR);
  quadF([L[0],L[1]-hWall],[B[0],B[1]-hWall],[G2[0],G2[1]-hRidge],[G1[0],G1[1]-hRidge],rL);
  quadF([B[0],B[1]-hWall],[R[0],R[1]-hWall],[G2[0],G2[1]-hRidge],[G2[0],G2[1]-hRidge],rR);
  // üçgen alınlık (sağ uç)
  ctx.fillStyle=shade(cR,8);
  ctx.beginPath();
  ctx.moveTo(B[0],B[1]-hWall);ctx.lineTo(R[0],R[1]-hWall);
  ctx.lineTo(G2[0],G2[1]-hRidge);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.stroke();
}
function drawBuilding(b){
  const t=BUILD_TYPES[b.key];
  const ht=t.ht;
  const x0=b.tx*TILE, y0=b.ty*TILE, x1=(b.tx+b.w)*TILE, y1=(b.ty+b.h)*TILE;
  const pT=P(x0,y0), pR=P(x1,y0), pB=P(x1,y1), pL=P(x0,y1);
  const flash=b.flash>0;
  const wallL=flash?'#fff':shade(TEAM_DARK[b.team],-8);
  const wallR=flash?'#fff':shade(TEAM_DARK[b.team],18);
  const roof =flash?'#fff':shade(TEAM_COLOR[b.team],-24);
  const conc='#8b8e7f', concD='#70746a';
  const W=x1-x0, H2=y1-y0;
  const fx=f=>x0+W*f, fy=f=>y0+H2*f;

  if(b.key==='tesla'){
    const cx=isoX(b.x,b.y)-cam.x, cy=isoY(b.x,b.y)-cam.y;
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(cx,cy,14,7,0,0,7);ctx.fill();
    ctx.fillStyle='#5f6257';
    ctx.beginPath();ctx.ellipse(cx,cy-2,11,5.5,0,0,7);ctx.fill();
    ctx.fillStyle='#3d4436';
    ctx.fillRect(cx-3,cy-26,6,24);
    ctx.strokeStyle='#7a4a2a';ctx.lineWidth=2;
    for(let r2=0;r2<3;r2++){
      ctx.beginPath();ctx.ellipse(cx,cy-10-r2*5,6,2.4,0,0,7);ctx.stroke();
    }
    const off=lowPower(b.team);
    const glow=off?0.15:(0.5+0.4*Math.sin(simTime*7+b.id));
    ctx.fillStyle='rgba(140,190,255,'+glow+')';
    ctx.beginPath();ctx.arc(cx,cy-30,7,0,7);ctx.fill();
    ctx.fillStyle=off?'#5a6a7c':'#aac8f0';
    ctx.beginPath();ctx.arc(cx,cy-30,4.5,0,7);ctx.fill();
    if(!off&&Math.random()<0.15){
      ctx.strokeStyle='rgba(170,210,255,.9)';ctx.lineWidth=1;
      ctx.beginPath();
      const a2=Math.random()*7;
      ctx.moveTo(cx,cy-30);
      ctx.lineTo(cx+Math.cos(a2)*9,cy-30+Math.sin(a2)*7);
      ctx.stroke();
    }
  }else if(b.key==='turret'){
    const cx=isoX(b.x,b.y)-cam.x, cy=isoY(b.x,b.y)-cam.y;
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(cx,cy,17,8,0,0,7);ctx.fill();
    ctx.fillStyle='#75786b';
    ctx.beginPath();ctx.ellipse(cx,cy-2,15,7.5,0,0,7);ctx.fill();
    ctx.fillStyle='#8b8e7f';
    ctx.beginPath();ctx.ellipse(cx,cy-5,12,6,0,0,7);ctx.fill();
    const off=lowPower(b.team);
    const a=isoAng(b.angle);
    ctx.save();ctx.translate(cx,cy-8);
    ctx.fillStyle=off?'#5a5d52':TEAM_DARK[b.team];
    ctx.beginPath();ctx.ellipse(0,0,8,5,0,0,7);ctx.fill();
    ctx.rotate(a);
    ctx.fillStyle=off?'#4a4d44':'#1e1e18';
    ctx.fillRect(0,-2.2,21,4.4);
    ctx.fillStyle='#3a3d34';ctx.fillRect(18,-3,4,6);
    if(b.muzzle>0&&!off){
      ctx.fillStyle='#ffe08a';
      ctx.beginPath();ctx.arc(24,0,4.5,0,7);ctx.fill();
    }
    ctx.restore();
  }else{
    // BETON TEMEL + GÖLGE (ortak)
    const pad=5;
    ctx.fillStyle=concD;
    ctx.beginPath();
    ctx.moveTo(pT[0],pT[1]-pad*0.5);ctx.lineTo(pR[0]+pad,pR[1]);
    ctx.lineTo(pB[0],pB[1]+pad*0.5);ctx.lineTo(pL[0]-pad,pL[1]);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.moveTo(pT[0],pT[1]);ctx.lineTo(pR[0]+7,pR[1]+3);
    ctx.lineTo(pB[0]+7,pB[1]+3);ctx.lineTo(pL[0],pL[1]);
    ctx.closePath();ctx.fill();

    if(b.key==='conyard'){
      boxW(fx(0),fy(0.45),fx(0.62),fy(1),0,14,wallL,wallR,shade(roof,-6),false,b.team,b.id); // çalışma hangarı
      // hangar açık ağzı
      const dM=P(fx(0.31),fy(1));
      ctx.fillStyle='#191b14';ctx.fillRect(dM[0]-9,dM[1]-12,18,10);
      boxW(fx(0),fy(0),fx(0.62),fy(0.48),0,24,wallL,wallR,roof,true,b.team,b.id);   // ana bina
      boxW(fx(0.62),fy(0.05),fx(1),fy(0.5),0,40,shade(wallL,6),shade(wallR,6),shade(roof,10),true,b.team,b.id); // kule
      const tw=P(fx(0.81),fy(0.27));
      ctx.strokeStyle='#d9b13b';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(tw[0],tw[1]-40);ctx.lineTo(tw[0]-30,tw[1]-30);ctx.stroke(); // vinç bomu
      ctx.strokeStyle='#8a8f7a';ctx.lineWidth=1;
      const sway=Math.sin(simTime*1.6)*2;
      ctx.beginPath();ctx.moveTo(tw[0]-24,tw[1]-32);ctx.lineTo(tw[0]-24+sway,tw[1]-12);ctx.stroke(); // halat
      ctx.fillStyle='#9a7434';ctx.fillRect(tw[0]-28+sway,tw[1]-12,8,6); // asılı kasa
      if(Math.sin(simTime*4)>0){
        ctx.fillStyle='#ff5a40';
        ctx.beginPath();ctx.arc(tw[0],tw[1]-42,2,0,7);ctx.fill();
      }
    }else if(b.key==='power'){
      boxW(fx(0),fy(0.15),fx(1),fy(1),0,15,wallL,wallR,roof,true,b.team,b.id);      // türbin salonu
      boxW(fx(0.15),fy(0.35),fx(0.85),fy(0.8),15,21,shade(wallL,10),shade(wallR,10),shade(roof,14),false); // yükseltilmiş çatı
      cylW(fx(0.3),fy(0.3),6,15,32,'#6f7266');
      cylW(fx(0.7),fy(0.3),6,15,32,'#6f7266');
      const s1=P(fx(0.3),fy(0.3)), s2=P(fx(0.7),fy(0.3));
      ctx.fillStyle='#c8402e';ctx.fillRect(s1[0]-6,s1[1]-32,12,3);ctx.fillRect(s2[0]-6,s2[1]-32,12,3);
      boxW(fx(0.08),fy(0.78),fx(0.42),fy(0.98),0,7,'#3a3d34','#4a4d42','#565a4d',false); // trafo
      const tr=P(fx(0.25),fy(0.88)), hall=P(fx(0.5),fy(0.6));
      ctx.strokeStyle='#2a2c24';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(tr[0],tr[1]-7);ctx.quadraticCurveTo((tr[0]+hall[0])/2,tr[1]-16,hall[0],hall[1]-15);ctx.stroke();
    }else if(b.key==='refinery'){
      boxW(fx(0),fy(0.3),fx(0.55),fy(1),0,17,wallL,wallR,roof,true,b.team,b.id);    // işleme salonu

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, bl=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));bl=Math.max(0,Math.min(255,bl));
  return '#'+((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0');
}

// ---- ana çizim ----
function draw(){
  const W=cvs.width,H=cvs.height;
  ctx.fillStyle='#141810';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.scale(zoom,zoom);
  const VW=W/zoom, VH=H/zoom;
  // arazi (ön-çizilmiş dilimler)
  const vx=cam.x+ISO_X0, vy=cam.y+ISO_Y0;
  for(const ch of terrChunks){
    const sx0=Math.max(vx,ch.x), sx1=Math.min(vx+VW,ch.x+ch.cvs.width);
    if(sx1<=sx0)continue;
    const sy0=Math.max(vy,0), sy1=Math.min(vy+VH,ch.cvs.height);
    if(sy1<=sy0)continue;
    ctx.drawImage(ch.cvs, sx0-ch.x, sy0, sx1-sx0, sy1-sy0,
                          sx0-vx,  sy0-vy, sx1-sx0, sy1-sy0);
  }

  // görünür karo aralığı (kaba): dünyada köşe noktaları
  const cor=[screenToWorld(0,0),screenToWorld(W,0),screenToWorld(0,H),screenToWorld(W,H)];
  let x0=MW-1,x1=0,y0=MH-1,y1=0;
  for(const [wx,wy] of cor){
    x0=Math.min(x0,Math.floor(wx/TILE));x1=Math.max(x1,Math.ceil(wx/TILE));
    y0=Math.min(y0,Math.floor(wy/TILE));y1=Math.max(y1,Math.ceil(wy/TILE));
  }
  x0=Math.max(0,x0-1);x1=Math.min(MW-1,x1+1);
  y0=Math.max(0,y0-1);y1=Math.min(MH-1,y1+1);

  drawWaterShimmer(x0,x1,y0,y1);
  drawFoam(x0,x1,y0,y1);

  // cevherler (zemin seviyesi)
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)
    if(ore[ty*MW+tx]>0)drawOre(tx,ty);

  // derinlik sıralı çizim listesi: ağaçlar + binalar + birimler
  const items=[];
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(tree[ty*MW+tx])items.push({d:(tx*TILE+16)+(ty*TILE+16),f:()=>drawTree(tx,ty)});
    if(ridge&&ridge[ty*MW+tx])items.push({d:(tx*TILE+16)+(ty*TILE+16),f:()=>drawRidge(tx,ty)});
  }
  for(const b of buildings){
    if(b.x/TILE<x0-3||b.x/TILE>x1+3||b.y/TILE<y0-3||b.y/TILE>y1+3)continue;
    items.push({d:b.x+b.y+(b.w+b.h)*TILE/2,f:()=>drawBuilding(b)});
  }
  for(const u of units){
    if(u.x/TILE<x0-2||u.x/TILE>x1+2||u.y/TILE<y0-2||u.y/TILE>y1+2)continue;
    items.push({d:u.x+u.y,f:()=>drawUnit(u)});
  }
  items.sort((a,b)=>a.d-b.d);
  for(const it of items)it.f();

  // mermiler (yay çizen top mermisi)
  for(const s of shells){
    const sx=isoX(s.x,s.y)-cam.x, sy=isoY(s.x,s.y)-cam.y-(s.z||0);
    if(s.arc){
      ctx.fillStyle='#e86a40';
      ctx.beginPath();ctx.arc(sx,sy-7,4,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,150,60,.5)';
      ctx.beginPath();ctx.arc(sx,sy-7,7,0,7);ctx.fill();
    }else{
      ctx.fillStyle='#ffd76a';
      ctx.beginPath();ctx.arc(sx,sy-7,3,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,180,80,.4)';
      ctx.beginPath();ctx.arc(sx,sy-7,5,0,7);ctx.fill();
    }
  }
  // izler
  for(const t of tracers){
    const x1=isoX(t.x1,t.y1)-cam.x, y1=isoY(t.x1,t.y1)-cam.y-8;
    const x2=isoX(t.x2,t.y2)-cam.x, y2=isoY(t.x2,t.y2)-cam.y-8;
    if(t.tesla){
      // KATMANLI YILDIRIM: geniş hale → mavi gövde → beyaz çekirdek + çatallar
      const al=Math.max(0,t.life/0.14);
      const segs=7, pts=[[x1,y1-22]];
      for(let k=1;k<=segs;k++){
        const f=k/segs;
        pts.push([
          x1+(x2-x1)*f+(k<segs?(Math.random()*16-8):0),
          (y1-22)+(y2-(y1-22))*f+(k<segs?(Math.random()*11-5.5):0)
        ]);
      }
      const path=()=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
        for(let k=1;k<pts.length;k++)ctx.lineTo(pts[k][0],pts[k][1]);};
      ctx.save();
      ctx.shadowColor='rgba(130,180,255,'+al+')';
      ctx.shadowBlur=14;
      ctx.strokeStyle='rgba(110,160,255,'+(al*0.35)+')';
      ctx.lineWidth=6.5;path();ctx.stroke();
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(158,204,255,'+(al*0.9)+')';
      ctx.lineWidth=2.6;path();ctx.stroke();
      ctx.strokeStyle='rgba(245,250,255,'+al+')';
      ctx.lineWidth=1.1;path();ctx.stroke();
      // çatallar: gövdeden kopan 2 kısa dal
      ctx.strokeStyle='rgba(190,220,255,'+(al*0.7)+')';
      ctx.lineWidth=1.2;
      for(let f2=0;f2<2;f2++){
        const src=pts[2+f2*3];
        if(!src)continue;
        const fa=Math.random()*7;
        ctx.beginPath();ctx.moveTo(src[0],src[1]);
        ctx.lineTo(src[0]+Math.cos(fa)*11,src[1]+Math.sin(fa)*8);
        ctx.lineTo(src[0]+Math.cos(fa)*17+4,src[1]+Math.sin(fa)*13);
        ctx.stroke();
      }
      ctx.restore();
      // vuruş noktasında parlama
      ctx.fillStyle='rgba(200,225,255,'+(al*0.5)+')';
      ctx.beginPath();ctx.arc(x2,y2,8*al+3,0,7);ctx.fill();
    }else{
      ctx.strokeStyle='rgba(255,233,160,'+Math.max(0,t.life/0.07)+')';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
  }
  // parçacıklar
  for(const p of particles){
    const sx=isoX(p.x,p.y)-cam.x, sy=isoY(p.x,p.y)-cam.y-(p.z||0);
    const al=Math.max(0,p.life/p.max);
    if(p.flash){
      ctx.fillStyle='rgba(255,242,192,'+al+')';
      ctx.beginPath();ctx.arc(sx,sy,18*(1-al+0.4),0,7);ctx.fill();
    }else if(p.heal){
      ctx.globalAlpha=al;
      ctx.fillStyle=p.c;
      ctx.fillRect(sx-1.5,sy-5,3,10);
      ctx.fillRect(sx-5,sy-1.5,10,3);
      ctx.globalAlpha=1;
    }else if(p.smoke){
      ctx.fillStyle=p.c;
      ctx.globalAlpha=al*0.5;
      ctx.beginPath();ctx.arc(sx,sy,4+ (1-al)*7,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }else{
      ctx.globalAlpha=al;
      ctx.fillStyle=p.c;
      ctx.fillRect(sx-2,sy-2,4,4);
      ctx.globalAlpha=1;
    }
  }

  // tamir modu: hasarlı binaları vurgula + imleçte anahtar
  if(repairMode){
    const pulse=0.35+0.25*Math.sin(simTime*6);
    for(const b of buildings){
      if(b.team!==PLAYER||b.hp>=b.maxHp)continue;
      ctx.fillStyle='rgba(126,240,126,'+pulse+')';
      for(let yy=b.ty;yy<b.ty+b.h;yy++)for(let xx=b.tx;xx<b.tx+b.w;xx++){
        const [ix,iy]=tileIso(xx,yy);
        diamondPath(ctx,ix-cam.x,iy-cam.y);ctx.fill();
      }
    }
  }
  // yerleştirme hayaleti
  if(placing){
    const t=BUILD_TYPES[placing.key];
    const [wx,wy]=screenToWorld(mouse.x,mouse.y);
    const tx=Math.floor(wx/TILE - t.w/2 + 0.5);
    const ty=Math.floor(wy/TILE - t.h/2 + 0.5);
    const ok=canPlace(placing.key,tx,ty,PLAYER);
    ctx.fillStyle=ok?'rgba(120,220,120,.4)':'rgba(230,80,60,.4)';
    for(let yy=ty;yy<ty+t.h;yy++)for(let xx=tx;xx<tx+t.w;xx++){
      const [ix,iy]=tileIso(xx,yy);
      diamondPath(ctx,ix-cam.x,iy-cam.y);ctx.fill();
    }
  }

  drawFog();
  ctx.restore(); // dünya katmanı sonu — UI fiziksel piksellerde
  drawNight();
  drawSnowfall();

  if(repairMode){
    ctx.font='20px sans-serif';
    ctx.fillText('🔧',mouse.x+12,mouse.y+22);
  }
  // seçim kutusu
  if(mouse.dragging){
    ctx.strokeStyle='#7ef07e';ctx.lineWidth=1;
    ctx.strokeRect(mouse.dragX,mouse.dragY,mouse.x-mouse.dragX,mouse.y-mouse.dragY);
  }
  drawMinimap();
}

let lightBlob=null, nightCvs=null, snowFl=null;
function getLightBlob(){
  if(lightBlob)return lightBlob;
  lightBlob=document.createElement('canvas');
  lightBlob.width=256;lightBlob.height=256;
  const c=lightBlob.getContext('2d');
  const g=c.createRadialGradient(128,128,10,128,128,128);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.55,'rgba(255,255,255,.75)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g;c.fillRect(0,0,256,256);
  return lightBlob;
}
function drawNight(){
  if(LEVEL<3||!l3)return;
  if(!nightCvs)nightCvs=document.createElement('canvas');
  if(nightCvs.width!==cvs.width||nightCvs.height!==cvs.height){
    nightCvs.width=cvs.width;nightCvs.height=cvs.height;
  }
  const nc=nightCvs.getContext('2d');
  const boltLite=Math.min(1,l3.bolt*1.6);
  const dark=(0.6+(l3.storm?0.1:0))*(1-boltLite);
  nc.globalCompositeOperation='source-over';
  nc.clearRect(0,0,nightCvs.width,nightCvs.height);
  nc.fillStyle='rgba(7,10,22,'+dark.toFixed(3)+')';
  nc.fillRect(0,0,nightCvs.width,nightCvs.height);
  // dost birlikler ışık konisi açar
  nc.globalCompositeOperation='destination-out';
  const blob=getLightBlob();
  const lf=(l3.storm?0.75:1)*zoom;
  for(const u of units){
    if(u.team!==PLAYER)continue;
    const [ex,ey]=entScreen(u);
    if(ex<-200||ey<-200||ex>cvs.width+200||ey>cvs.height+200)continue;
    const r=(u.key==='rdrone'?150:100)*lf;
    nc.drawImage(blob,ex-r,ey-r,r*2,r*2);
  }
  for(const b of buildings){
    if(b.team!==PLAYER)continue;
    const [ex,ey]=entScreen(b);
    if(ex<-260||ey<-260||ex>cvs.width+260||ey>cvs.height+260)continue;
    const r=(90+b.w*28)*lf;
    nc.drawImage(blob,ex-r,ey-r,r*2,r*2);
  }
  // patlamalar geceyi deler
  for(const p of particles){
    if(!p.flash)continue;
    const ex=(isoX(p.x,p.y)-cam.x)*zoom, ey=(isoY(p.x,p.y)-cam.y)*zoom;
    const r=120*zoom;
    nc.drawImage(blob,ex-r,ey-r,r*2,r*2);
  }
  ctx.drawImage(nightCvs,0,0);
  if(l3.bolt>0){ // şimşek beyazı
    ctx.fillStyle='rgba(215,228,255,'+(l3.bolt*0.3).toFixed(3)+')';
    ctx.fillRect(0,0,cvs.width,cvs.height);
  }
}
function drawSnowfall(){
  if(LEVEL<3||!l3)return;
  if(!snowFl){
    snowFl=[];
    for(let k=0;k<110;k++)snowFl.push({x:Math.random(),y:Math.random(),s:0.5+Math.random()});
  }
  const W=cvs.width,H=cvs.height;
  const storm=l3.storm;
  ctx.fillStyle='rgba(235,242,248,.8)';
  ctx.strokeStyle='rgba(235,242,248,.65)';
  ctx.lineWidth=1.4;
  for(const f of snowFl){
    f.y+=(storm?0.012:0.0022)*f.s;
    f.x+=(storm?0.008:0.0009)*f.s+Math.sin(simTime*1.5+f.s*9)*0.0004;
    if(f.y>1){f.y=0;f.x=Math.random();}
    if(f.x>1)f.x-=1;
    const px=f.x*W, py=f.y*H;
    if(storm){
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-9*f.s,py-4*f.s);ctx.stroke();
    }else{
      ctx.fillRect(px,py,1.6*f.s,1.6*f.s);
    }
  }
}
let fogFrameSkip=0;
function drawFog(){
  if(!fogSmCtx||!exploredA)return;
  // açılım animasyonu: keşfedilen karo yumuşakça aydınlanır
  if((fogFrameSkip++&1)===0){
    const n=MW*MH;
    for(let i=0;i<n;i++){
      if(explored[i]&&exploredA[i]<1)exploredA[i]=Math.min(1,exploredA[i]+0.06);
    }
    const img=fogSmCtx.createImageData(MW,MH);
    const d=img.data;
    for(let i=0;i<n;i++){
      d[i*4]=7; d[i*4+1]=9; d[i*4+2]=13;
      d[i*4+3]=Math.round((1-exploredA[i])*235);
    }
    fogSmCtx.putImageData(img,0,0);
  }
  // iso dönüşümüyle büyüt: bilinear yumuşatma keskin karoları eritir
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  ctx.transform(TILE,IH/2,-TILE,IH/2,-cam.x,-cam.y);
  ctx.drawImage(fogSm,0,0);
  ctx.restore();
}

let shoreFoam=[], shoreSand=[], sandMask=null;
let sandCvs=null;
const SAND_R=2; // karo başına 2 alt-piksel: kıvrımlı kıyı şekli
function buildSandLayer(){
  if(LEVEL>=3){sandCvs=null;return;}
  sandCvs=document.createElement('canvas');
  sandCvs.width=MW*SAND_R; sandCvs.height=MH*SAND_R;
  const sc=sandCvs.getContext('2d');
  // karo bazlı yoğunluk alanı
  const f=new Float32Array(MW*MH);
  for(let i=0;i<MW*MH;i++)if(sandMask[i])f[i]=1;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const i=ty*MW+tx;
    if(f[i])continue;
    let nearSand=false;
    for(const [ax,ay] of dirs){
      const nx=tx+ax,ny=ty+ay;
      if(inMap(nx,ny)&&sandMask[ny*MW+nx]){nearSand=true;break;}
    }
    if(nearSand)f[i]=water[i]?(bridge[i]?0:0.52):0.40; // suya ve çimene ilk halka
  }
  const g2=new Float32Array(f);
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){ // suda ikinci halka: derinliğe eriyiş
    const i=ty*MW+tx;
    if(f[i]||!water[i]||bridge[i])continue;
    for(const [ax,ay] of dirs){
      const nx=tx+ax,ny=ty+ay;
      if(inMap(nx,ny)&&water[ny*MW+nx]&&f[ny*MW+nx]>=0.5){g2[i]=0.2;break;}
    }
  }
  // alt-piksel doldurma + doğal pürüz
  const img=sc.createImageData(MW*SAND_R,MH*SAND_R);
  const d=img.data;
  for(let py=0;py<MH*SAND_R;py++)for(let px=0;px<MW*SAND_R;px++){
    const v0=g2[Math.floor(py/SAND_R)*MW+Math.floor(px/SAND_R)];
    let v=0;
    if(v0>0)v=Math.max(0,Math.min(1,v0+(hash2(px*7+1,py*13+2)-0.5)*0.34));
    const o=(py*MW*SAND_R+px)*4;
    d[o]=197; d[o+1]=178; d[o+2]=131;
    d[o+3]=Math.round(v*255);
  }
  sc.putImageData(img,0,0);
}
function buildShore(){
  shoreFoam=[];shoreSand=[];
  sandMask=new Uint8Array(MW*MH);
  if(LEVEL>=3)return; // karda kumsal yok
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const i=ty*MW+tx;
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    if(water[i]&&!bridge[i]){
      let dx=0,dy=0,found=false;
      for(const [ax,ay] of dirs){
        const nx=tx+ax,ny=ty+ay;
        if(inMap(nx,ny)&&!water[ny*MW+nx]){dx+=ax;dy+=ay;found=true;}
      }
      if(found&&(dx||dy))shoreFoam.push({tx,ty,dx,dy,ph:hash2(tx,ty)});
    }else if(!water[i]){
      for(const [ax,ay] of dirs){
        const nx=tx+ax,ny=ty+ay;
        if(inMap(nx,ny)&&water[ny*MW+nx]){shoreSand.push({tx,ty,dx:ax,dy:ay});sandMask[i]=1;}
      }
    }
  }
}
function drawFoam(x0,x1,y0,y1){
  for(const f of shoreFoam){
    if(f.tx<x0||f.tx>x1||f.ty<y0||f.ty>y1)continue;
    const [ix,iy]=tileIso(f.tx,f.ty);
    const cx=ix-cam.x, cy=iy-cam.y+IH/2;
    let idx=f.dx-f.dy, idy=(f.dx+f.dy)/2;
    const il=Math.hypot(idx,idy)||1; idx/=il; idy/=il;
    const rot=Math.atan2(idy,idx)+Math.PI/2;
    const ph=simTime*1.4+f.ph*6.283;
    for(let w2=0;w2<2;w2++){
      const k=(Math.sin(ph-w2*2.1)+1)/2;   // 0→1: köpük kıyıya ilerler
      const off=3+10*k;
      const al=(1-k)*0.26+0.04;
      ctx.fillStyle='rgba(236,246,242,'+al.toFixed(3)+')';
      ctx.beginPath();
      ctx.ellipse(cx+idx*off, cy+idy*off, 10.5-3*w2, 3-w2*0.8, rot, 0, 7);
      ctx.fill();
    }
  }
}
function drawMinimap(){
  const s=mmCvs.width/MW;
  mmCtx.fillStyle='#20261a';mmCtx.fillRect(0,0,mmCvs.width,mmCvs.height);
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const i=ty*MW+tx;
    if(!explored[i])continue;
    if(water[i]){mmCtx.fillStyle=bridge[i]?'#7a5b36':'#2c5666';mmCtx.fillRect(tx*s,ty*s,s+0.5,s+0.5);}
    else if(tree[i]){mmCtx.fillStyle='#2f4a24';mmCtx.fillRect(tx*s,ty*s,s+0.5,s+0.5);}
    else if(ore[i]>0){mmCtx.fillStyle='#d9b13b';mmCtx.fillRect(tx*s,ty*s,s+0.5,s+0.5);}
  }
  for(const b of buildings){
    if(b.team===ENEMY&&!explored[Math.floor(b.y/TILE)*MW+Math.floor(b.x/TILE)])continue;
    mmCtx.fillStyle=TEAM_COLOR[b.team];
    mmCtx.fillRect(b.tx*s,b.ty*s,b.w*s,b.h*s);
  }
  for(const u of units){
    const ti=Math.floor(u.y/TILE)*MW+Math.floor(u.x/TILE);
    if(u.team===ENEMY&&!explored[ti])continue;
    mmCtx.fillStyle=TEAM_COLOR[u.team];
    mmCtx.fillRect(u.x/TILE*s-1,u.y/TILE*s-1,2.5,2.5);
  }
  mmCtx.fillStyle='#000';
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++)
    if(!explored[ty*MW+tx])mmCtx.fillRect(tx*s,ty*s,s+0.5,s+0.5);
  // görünüm çerçevesi: ekran köşelerinin dünya izdüşümü
  mmCtx.strokeStyle='#fff';mmCtx.lineWidth=1;
  mmCtx.beginPath();
  const cs=[[0,0],[cvs.width,0],[cvs.width,cvs.height],[0,cvs.height]];
  cs.forEach(([px,py],i)=>{
    const [wx,wy]=screenToWorld(px,py);
    const mx=wx/WORLD_W*mmCvs.width, my=wy/WORLD_H*mmCvs.height;
    if(i===0)mmCtx.moveTo(mx,my);else mmCtx.lineTo(mx,my);
  });
  mmCtx.closePath();mmCtx.stroke();
}

function startGame(level){

  l3=LEVEL>=3?{rampT:1500,total:1500,tech:false,bolt:0,nextBolt:14,storm:false,stormT:38,w5:false,w1:false}:null;

// bina bacaları + hasar dumanı
let smokeTimer=0;
function updateSmoke(dt){
  smokeTimer-=dt;
  if(smokeTimer>0)return;
  smokeTimer=0.22;
  for(const b of buildings){
    if(b.key==='power')smoke(b.x+(Math.random()*8-4), b.y-10,false);
    if(b.key==='nuclear'){const st=smoke(b.x-6+(Math.random()*6-3), b.y-8,false);}
    if(b.key==='factory'&&Math.random()<0.5)smoke(b.x-8,b.y-6,false);
    if(b.hp<b.maxHp*0.5)smoke(b.x+(Math.random()*16-8), b.y+(Math.random()*16-8),true);
  }
  for(const u of units){
    if(u.hp<u.maxHp*0.35&&(u.key==='tank'||u.key==='heavy'||u.key==='harv'))
      smoke(u.x,u.y,true);
    // toz bulutu: hareket eden paletliler
    if(u.domain==='ground'&&(u.key==='tank'||u.key==='heavy'||u.key==='harv'||u.key==='arty')
       &&u.path&&Math.random()<0.5){
      particles.push({x:u.x-Math.cos(u.angle)*14,y:u.y-Math.sin(u.angle)*14,
        vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,vz:8+Math.random()*8,z:2,
        life:0.8+Math.random()*0.5,max:1.3,smoke:true,
        c:LEVEL>=3?'#dde4ea':'#8a7d5e'});
    }
  }
}

// ---------- DÖNGÜ ----------
let lastT=0;
function frame(t){
  requestAnimationFrame(frame);
  if(!running)return;
  const dt=Math.min(0.05,(t-lastT)/1000)||0.016;
  lastT=t;
  if(!paused&&!gameOver){
    update(dt);
  }
  draw();
  refreshButtonProgress();
  $('credits').textContent='₺ '+Math.floor(credits[PLAYER]);
  const [pp,pu]=powerStats(PLAYER);
  $('powerfill').style.width=Math.max(0,Math.min(100,pp>0?(1-pu/pp)*100:0))+'%';
  $('powerfill').style.background=pu>pp?'#d8442f':'#5fae4a';
  $('powertxt').textContent=pu+'/'+pp;
  const rt=$('rampTimer');
  if(LEVEL>=3&&l3&&buildings.some(b=>b.team===ENEMY&&b.key==='ramp')){
    rt.style.display='block';
    const mm=Math.floor(Math.max(0,l3.rampT)/60), ss=Math.floor(Math.max(0,l3.rampT)%60);
    rt.textContent='☄ '+mm+':'+String(ss).padStart(2,'0');
    rt.style.color=l3.rampT<60?'#ff4530':(l3.rampT<300?'#e8a030':'var(--red)');
  }else rt.style.display='none';
}
function updateL3FX(dt){
  if(!l3)return;
  l3.bolt=Math.max(0,l3.bolt-dt*2);
  l3.nextBolt-=dt;
  if(l3.nextBolt<=0){
    l3.nextBolt=13+Math.random()*18;
    l3.bolt=1;
    sfx('thunder');
  }
  l3.stormT-=dt;
  if(l3.stormT<=0){
    l3.storm=!l3.storm;
    l3.stormT=l3.storm?(10+Math.random()*7):(30+Math.random()*22);
    if(l3.storm){notify('🌨 TİPİ! Görüş düşüyor...',true);}
    else notify('🌨 Tipi dindi.');
  }
}
function update(dt){
  simTime+=dt;
  updateL3FX(dt);
  updateCamera(dt);
  updateQueues(dt);
  for(const a of ais)updateAI(a,dt);
  for(const u of units)updateUnit(u,dt);
  for(const b of buildings)if(b.key==='turret'||b.key==='tesla'||b.key==='sam')updateDefense(b,dt);
  updateRepairs(dt);
  updateShells(dt);
  separation();
  updateFog(dt);
  updateSmoke(dt);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.vz!==undefined){p.z=(p.z||0)+p.vz*dt; if(p.grav)p.vz-=180*dt;}
    p.vx*=0.94;p.vy*=0.94;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=tracers.length-1;i>=0;i--){
    tracers[i].life-=dt;
    if(tracers[i].life<=0)tracers.splice(i,1);
  }
}
